# povflow configuration
# Diese Datei ist die einzige, die du normalerweise anfassen musst.

[channel]
# Die Nische. Freitext — landet direkt im Ideen-Prompt.
niche = "fantasy creature encounters"

# Bildwelt. Verfuegbar: "fantasy", "wildlife", "urban", "survival"
style_preset = "fantasy"

audience = "TikTok und Reels, 16-30"

# Sprache des Voice-over-Skripts.
language = "de"

# Der wichtigste Regler fuer Ideen-Qualitaet. Je konkreter, desto besser.
concept_brief = """
Wiederkehrende Serie: Ich filme mit dem Handy Begegnungen mit Kreaturen,
die es nicht geben duerfte. Immer erste Person, immer so, als waere es
echtes Material. Kein Fantasy-Kitsch, keine Ritter, keine Magie-Effekte.
Die Kreatur wirkt wie ein echtes Tier: schwer, unberechenbar, gefaehrlich.
Jede Folge endet, bevor klar ist, wie es ausgeht.
"""

# Kommt garantiert nie vor.
forbidden = [
  "Blut, Verletzungen, Leichen",
  "echte Marken oder Logos",
  "Kinder",
  "erkennbare reale Personen",
]

[video]
# "manual" = Standard. Das Tool macht alles ausser der Clip-Generierung: Ideen,
#            Prompts, Schnitt, Voice-over-Skript. Die Clips generierst du selbst
#            in Flow mit deinen Abo-Credits — ca. 8x guenstiger als die API.
# "omni"   = Gemini Omni Flash ueber die API. Vollautomatisch, kann Shots
#            aneinanderketten (bessere Kontinuitaet). Nur 720p, 3-10s.
#            Kostet API-Preise, NICHT deine Abo-Credits.
# "veo"    = Veo 3.1 ueber die API. Kein Chaining, dafuer 1080p und 4K.
backend = "manual"

# Nur bei backend = "omni": jeder Shot baut auf dem vorherigen auf.
# Kostet pro verkettetem Shot etwas extra (das vorherige Video zaehlt als Input),
# ist aber der Hauptgrund, Omni zu nehmen. Auf false = jeder Shot startet neu.
chain_shots = true

# Passend zum Backend:
#   omni -> "gemini-omni-flash-preview"
#   veo  -> "veo-3.1-fast-generate-preview" | "veo-3.1-lite-generate-preview"
#           | "veo-3.1-generate-preview"
model = "gemini-omni-flash-preview"

# Modell fuer die Ideen-Generierung (guenstig, nur Text).
idea_model = "gemini-2.5-flash"

# Bei backend = "manual": die Aufloesung, die aus Flow rauskommt. Wenn du in
# Flow gratis auf 1080p hochskalierst, hier "1080p" eintragen.
resolution = "1080p"
aspect_ratio = "9:16"    # Hochkant fuer TikTok/Reels/Shorts

seconds_per_shot = 8     # Omni: 3-10s erlaubt. Veo: 8s.
shots_per_episode = 5    # 5 x 8s = 40s Video

# Umgebungsgeraeusche bleiben als Bett unter deinem Voice-over liegen.
# Auf false setzen, wenn du komplett stumme Clips willst.
keep_ambient_audio = true
ambient_audio_gain_db = -18.0

[costs]
# Harte Obergrenzen — gelten nur fuer die API-Backends "omni" und "veo".
# Bei backend = "manual" laeuft nichts ueber die API, also greift hier nichts.
max_usd_per_run = 6.0
max_usd_per_month = 120.0

# Dein Flow-Abo. Wird nur zur Anzeige benutzt (povflow costs), nicht abgerechnet.
[costs.credits]
credits_per_second = 1.0   # 15s Video = 15 Credits
plan_eur = 27.99
plan_credits = 2500

# Ausgabe-Preise pro Sekunde (Stand August 2026).
# Anpassen, falls Google sie aendert.
[costs.rates]
"gemini-omni-flash-preview:720p" = 0.10
"veo-3.1-lite-generate-preview:720p" = 0.05
"veo-3.1-lite-generate-preview:1080p" = 0.08
"veo-3.1-fast-generate-preview:720p" = 0.10
"veo-3.1-fast-generate-preview:1080p" = 0.12
"veo-3.1-generate-preview:720p" = 0.40
"veo-3.1-generate-preview:1080p" = 0.40

[paths]
output_dir = "output"
state_db = "state/povflow.sqlite3"

[runtime]
poll_interval_s = 15
max_retries = 3
