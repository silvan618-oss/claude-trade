h with natural British accents, casual teenage talk. The Snapchat caption bar with the white text in the photo stays exactly as it is on screen for the whole video, like a fixed overlay. A huge candlelit dining hall, a long wooden bench in the foreground, students everywhere. A round-faced boy with dark hair holds up a pair of round glasses and checks them. A ginger boy with a red-gold tie looks at a watch on his wrist and grins. A girl with long red hair looks down at a small coin in her hands. On the left a pale boy with white-blond hair and a green-silver tie stands with his arms crossed and a sour face, holding nothing. For the first two seconds the ginger boy keeps admiring his watch and the blond boy keeps glaring at it, as if they heard me. Then the ginger boy looks at the camera and says with lips moving: \"It was in the bucket. Everything was in the bucket.\" He listens for two seconds as if I'm answering. The blond boy looks at the camera and says: \"Not everything.\" The ginger boy holds up his wrist toward the blond boy and says: \"Maybe it just liked your ring more, Malfoy.\" The blond boy says: \"It's a family heirloom.\" The round-faced boy puts his glasses on and looks at the blond boy through them, and the ginger boy laughs. Two seconds pass with the blond boy glaring at me over his crossed arms. Warm candlelight. Vertical 9:16. No watermark, no visible phone or camera."}, {"n": 9, "title": "hagrid said we can't keep it", "attach": "Startframe = Bild „hagrid said we can't keep it“", "note": "Niffler", "img": "Candid first-person video from my own eye level, as if I just raised my old iPhone from the top of the steps and hit record. 2015 smartphone video quality: soft focus, visible noise and slight compression, motion blur, uneven handheld framing that shakes in my hand, people cut off at the edges, no flash, no filter, audio like a phone microphone with wind, boots crunching in snow, a bucket clanking and a small creature chittering. The person hol
