<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root{--bg:#f1f1ee;--surface:#ffffff;--ink:#151515;--muted:#5d5d58;--line:#dcdcd6;--accent:#f2e600;--accent-ink:#151515;--bar:rgba(0,0,0,.62);--chip:#ebebe6;--btn:#151515;--btn-ink:#f8f8f4;--mono:#2a2a2a;--focus:#1a73e8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111111;--surface:#1b1b1b;--ink:#ececea;--muted:#a0a09a;--line:#2d2d2b;--accent:#fff04d;--accent-ink:#151515;--bar:rgba(0,0,0,.7);--chip:#262624;--btn:#fff04d;--btn-ink:#151515;--mono:#d8d8d4;--focus:#8ab4f8}}
:root[data-theme="dark"]{--bg:#111111;--surface:#1b1b1b;--ink:#ececea;--muted:#a0a09a;--line:#2d2d2b;--accent:#fff04d;--accent-ink:#151515;--bar:rgba(0,0,0,.7);--chip:#262624;--btn:#fff04d;--btn-ink:#151515;--mono:#d8d8d4;--focus:#8ab4f8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:720px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
h1{font-family:"Archivo Black",Impact,sans-serif;font-size:22px;margin:0 0 10px;letter-spacing:-.01em;text-wrap:balance}
.tabs{display:flex;gap:8px}
.tab{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 12px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab:focus-visible,.btn:focus-visible,.mini:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.world{display:none}.world.on{display:block}
.topbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-block:16px;display:grid;gap:12px}
.topbox p{margin:0;color:var(--muted)}
.btn{border:0;background:var(--btn);color:var(--btn-ink);font:inherit;font-weight:600;padding:14px 16px;border-radius:12px;cursor:pointer;width:100%;font-size:16px}
.btn.sec{background:var(--chip);color:var(--ink)}
ol.clips{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.clip{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.clip-head{display:flex;align-items:center;gap:10px}
.num{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.cap{background:var(--bar);color:#fff;font-family:Helvetica,Arial,sans-serif;font-size:15px;padding:6px 12px;flex:1;text-align:center;border-radius:2px;min-width:0;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.chip{background:var(--chip);color:var(--ink);padding:3px 10px;border-radius:999px;font-weight:500;font-size:12.5px}
.note{font-size:12.5px;color:var(--muted)}
.block{display:grid;gap:6px}
.block-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lab{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.mini{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer}
.mini.primary{background:var(--btn);color:var(--btn-ink);border-color:transparent}
pre{margin:0;font-family:"JetBrains Mono",Menlo,monospace;font-size:12px;line-height:1.55;color:var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--chip);padding:10px 12px;border-radius:10px;max-height:4.7em;overflow:hidden;position:relative}
pre.open{max-height:none}
.more{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;padding:0;cursor:pointer;text-decoration:underline;justify-self:start}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:9}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>

ning wider: \"Tell us if your ears go.\" The boy with his back to me shakes his head and pushes the sweet back. The twins burst out laughing and the camera dips as I lean away. Warm orange firelight. Vertical 9:16. No watermark, no visible phone or camera."}, {"n": 3, "title": "ravenclaw won. pay up", "attach": "Startframe = das Bild mit dieser Caption", "note": "Video 1", "img": "Candid first-person video from my own eye level, as if I just raised my old iPhone across the pub table and hit record. 2015 smartphone video quality: soft focus, visible noise and slight compression, motion blur, uneven handheld framing that shakes in my hand, people cut off at the edges, no flash, no filter, audio like a phone microphone with a noisy pub, mugs knocking on wood, chatter and laughter all around. The person holding the camera never speaks and makes no sound. The only person who speaks is the pale boy with slicked blond hair, and he faces the camera when speaking so his lips are visible moving with every word. All dialogue is spoken in English with natural British accents, casual teenage talk. The Snapchat caption bar with the white text in the photo stays exactly as it is on screen for the whole video, like a fixed overlay. A dark wooden pub full of students in black robes, oil lamps on the walls, a scratched table with several mugs of butterbeer. Across the table a pale teenage boy with slicked-back white-blond hair, a green-silver tie and black robes glares straight into the camera with a sour face, one hand reaching for a mug. My finger is blurred over the bottom corner of the lens. For the first two seconds my finger slides off the lens and he keeps glaring, hand frozen on the mug, as if waiting for me to stop talking. Then he says with lips moving: \"It doesn't count. Your seeker got lucky.\" He listens for two seconds as if I'm answering, rolls his eyes and says: \"Fine.\" He shoves the full mug across the table toward the lens so the foam slops over, and says: \"One. e finally eats the spoonful, turns the magazine the right way round, frowns at it, turns it upside down again and says: \"Better. You've got wrackspurts, that's why you can't see it.\" Two seconds pass while she goes back to reading with the spoon raised again, and a student walks past behind her. Grey daylight from the windows. Vertical 9:16. No watermark, no visible phone or camera."}, {"n": 5, "title": "he said it wasn't going to snow", "attach": "Startframe = das Bild mit dieser Caption", "note": "Video 1", "img": "Candid first-person video from my own eye level, as if I just raised my old iPhone in the snowy village street and hit record. 2015 smartphone video quality: soft focus, visible noise and slight compression, motion blur, uneven handheld framing that shakes in my hand, people cut off at the edges, no flash, no filter, audio like a phone microphone with wind, snow crunching, shop bells and three people laughing. The person holding the camera never speaks and makes no sound. The only people who speak are the ginger boy with the scarf, the boy with round glasses and the girl with bushy hair, and each turns their face to the camera before speaking so their lips are visible moving with every word. All dialogue is spoken in English with natural British accents, casual teenage talk. The Snapchat caption bar with the white text in the photo stays exactly as it is on screen for the whole video, like a fixed overlay. A snow-covered village street with a shop front, warm lit windows and snow falling. A tall teenage boy with ginger hair, black robes and a red-gold scarf, snow on his shoulders, waves one hand at the sky mid-argument. Behind him a boy with round glasses and a girl with bushy brown hair grin at him. The grey beanie of a friend is blurred large in the bottom corner. For the first two seconds the ginger boy keeps waving his hand at the falling snow and glares up at it, as if he heard me. Then he looks at the camera and says with lips moving: \"That's not proper snow. That's sleet.\" The girl behind him laughs and says to the camera: \"He said clear skies. All week.\" The ginger boy turns back to the camera and says: \"Stop filming me.\" He listens for two seconds as if I'm answering, snow landing on his hair. The boy with glasses leans into frame and says: \"He's still not wearing a hat.\" The ginger boy pulls his robes tight and stomps off toward the shop door, the other two follow him laughing and the camera swings after them. Flat grey daylight, heavy snowfall. Vertical 9:16. No watermark, no visible phone or camera."}, {"n": 6, "title": "he named it kevin", "attach": "Startframe = das Bild mit dieser Caption", "note": "Video 1", "img": "Candid first-person video from my own eye level, as if I just raised my old iPhone in the greenhouse and hit record. 2015 smartphone video quality: soft focus, visible noise and slight compression, motion blur, uneven handheld framing that shakes in my hand, people cut off at the edges, no flash, no filter, audio like a phone microphone with rain tapping on the glass roof, pots clinking and students chatting somewhere behind me. The person holding the camera never speaks and makes no sound. The only people who speak are the boy in the grey jumper holding the plant and the girl with long hair in the foreground, and each turns their face to the camera before speaking so their lips are visible moving with every word. All dialogue is spoken in English with natural British accents, casual teenage talk. The Snapchat caption bar with the white text in the photo stays exactly as it is on screen for the whole video, like a fixed overlay. A steamy greenhouse with fogged glass walls and clay pots on a wooden bench. A boy with messy brown hair, a grey jumper and a red-gold tie holds up a muddy uprooted plant with both gloved hands, staring at its dangling roots with a serious face. On the left, very close to the lens and blurred, a girl with long hair stands with her back half to me. For const INSTR = (name)=>`ANLEITUNG FÜR FLOW – WIZARDING WORLD, 6 VIDEO-PROMPTS
Omni Flash 1.1, 10 Sekunden, 9:16. Für jeden Clip das Bild mit derselben Caption als Startframe nehmen und den VIDEO-Prompt eingeben.
Alle Dialoge auf Englisch mit britischem Akzent. Der Kamerahalter spricht nie. Jeder Satz gehört zu der sichtbaren Person, die im Prompt genannt ist, mit sichtbar bewegtem Mund.
`;
function clipText(w,c){return `=== ${c.note} · CLIP ${c.n}: ${c.title} ===\nStartframe: das fertige Bild mit dieser Caption\n\n[VIDEO-PROMPT]\n${c.img}\n`;}
function allText(w){return INSTR(w.name)+'\n'+w.clips.map(c=>clipText(w,c)).join('\n');}
function copy(t){const done=()=>{const el=document.getElementById('toast');el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1400);};
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,()=>fallback(t,done));}else fallback(t,done);}
function fallback(t,done){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');done();}catch(e){}document.body.removeChild(ta);}
function esc(s){return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
const tabs=document.getElementById('tabs'),host=document.getElementById('worlds');
DATA.forEach((w,i)=>{
 const t=document.createElement('button');t.className='tab';t.role='tab';t.textContent=`${w.name} · ${w.clips.length}`;t.setAttribute('aria-selected',i===0);t.onclick=()=>select(w.key);tabs.appendChild(t);
 const sec=document.createElement('section');sec.className='world'+(i===0?' on':'');sec.id='w-'+w.key;
 sec.innerHTML=`<div class="topbox"><button class="btn" data-all="${w.key}">Alle ${w.clips.length} Video-Prompts kopieren (mit Anleitung)</button><p>Wizarding World, die 6 Video-Prompts zu den 6 Bildern. Startframe ist jeweils das Bild mit derselben Caption.</p></div>
 <ol class="clips">${w.clips.map(c=>`<li class="clip"><div class="clip-head"><span class="num">${c.note.replace('Video ','V')}·${String(c.n).padStart(2,'0')}</span><span class="cap">${esc(c.title)}</span></div>
 <div class="meta"><span class="chip">${esc(c.attach)}</span></div>
 <div class="block"><div class="block-h"><span class="lab">Video-Prompt (10 s)</span><button class="mini" data-copy="img" data-w="${w.key}" data-n="${c.n}">Kopieren</button></div><pre>${esc(c.img)}</pre><button class="more">Ganzen Prompt anzeigen</button></div>
 </li>`).join('')}</ol>`;
 host.appendChild(sec);
});
function select(k){DATA.forEach((w,i)=>{tabs.children[i].setAttribute('aria-selected',w.key===k);document.getElementById('w-'+w.key).classList.toggle('on',w.key===k);});window.scrollTo({top:0});}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.all){copy(allText(DATA.find(w=>w.key===b.dataset.all)));return;}
 if(b.dataset.copy){const w=DATA.find(x=>x.key===b.dataset.w),c=w.clips[+b.dataset.n-1];copy(b.dataset.copy==='img'?c.img:b.dataset.copy==='vid'?c.vid:clipText(w,c));return;}
 if(b.classList.contains('more')){const p=b.previousElementSibling;p.classList.toggle('open');b.textContent=p.classList.contains('open')?'Einklappen':'Ganzen Prompt anzeigen';}
});
</script>
