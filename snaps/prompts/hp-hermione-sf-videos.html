<style>
:root{--bg:#f1f1ee;--surface:#ffffff;--ink:#151515;--muted:#5d5d58;--line:#dcdcd6;--accent:#f2e600;--accent-ink:#151515;--bar:rgba(0,0,0,.62);--chip:#ebebe6;--btn:#151515;--btn-ink:#f8f8f4;--mono:#2a2a2a;--focus:#1a73e8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111111;--surface:#1b1b1b;--ink:#ececea;--muted:#a0a09a;--line:#2d2d2b;--accent:#fff04d;--accent-ink:#151515;--bar:rgba(0,0,0,.7);--chip:#262624;--btn:#fff04d;--btn-ink:#151515;--mono:#d8d8d4;--focus:#8ab4f8}}
:root[data-theme="dark"]{--bg:#111111;--surface:#1b1b1b;--ink:#ececea;--muted:#a0a09a;--line:#2d2d2b;--accent:#fff04d;--accent-ink:#151515;--bar:rgba(0,0,0,.7);--chip:#262624;--btn:#fff04d;--btn-ink:#151515;--mono:#d8d8d4;--focus:#8ab4f8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:720px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
h1{font-family:"Archivo Black",Impact,sans-serif;font-size:22px;margin:0 0 10px;letter-spacing:-.01em;text-wrap:balance}
.tabs{display:flex;gap:8px}
.tab{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 12px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab:focus-visible,.btn:focus-visible,.mini:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.world{display:none}.world.on{display:block}
.topbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-block:16px;display:grid;gap:12px}
.topbox p{margin:0;color:var(--muted)}
.btn{border:0;background:var(--btn);color:var(--btn-ink);font:inherit;font-weight:600;padding:14px 16px;border-radius:12px;cursor:pointer;width:100%;font-size:16px}
.btn.sec{background:var(--chip);color:var(--ink)}
ol.clips{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.clip{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.clip-head{display:flex;align-items:center;gap:10px}
.num{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.cap{background:var(--bar);color:#fff;font-family:Helvetica,Arial,sans-serif;font-size:15px;padding:6px 12px;flex:1;text-align:center;border-radius:2px;min-width:0;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.chip{background:var(--chip);color:var(--ink);padding:3px 10px;border-radius:999px;font-weight:500;font-size:12.5px}
.note{font-size:12.5px;color:var(--muted)}
.block{display:grid;gap:6px}
.block-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lab{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.mini{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer}
.mini.primary{background:var(--btn);color:var(--btn-ink);border-color:transparent}
pre{margin:0;font-family:"JetBrains Mono",Menlo,monospace;font-size:12px;line-height:1.55;color:var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--chip);padding:10px 12px;border-radius:10px;max-height:4.7em;overflow:hidden;position:relative}
pre.open{max-height:none}
.more{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;padding:0;cursor:pointer;text-decoration:underline;justify-self:start}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:9}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>

tten timetables side by side, both headed the girl with bushy brown hair, a third one lying upside down further back, a pewter goblet and a quill. My own hand in the frame. For the first two seconds my finger rests on the word Arithmancy on the left sheet. Then it slides across to the word Divination on the right sheet, taps it twice, goes back to Arithmancy, and taps again. My hand picks up both sheets, holds them side by side close to the lens so both entries are readable, then lays them back down. Two seconds of the hand resting flat between the two sheets. The camera stays low over the table the whole time. Vertical 9:16."}, {"n": 5, "title": "we followed her", "attach": "Startframe = Bild „we followed her“", "note": "Hermine", "img": "Exact same style as the start image: same image quality, same kind of random bad phone video, just as soft and noisy. Candid first-person video from my own eye level, handheld and a bit shaky, people cut off at the edges. Not a film still, not a studio, not a DSLR. Audio like a phone microphone with a stone stairwell, footsteps and whispering. The person holding the camera never speaks. Only the ginger boy speaks, and he looks at the camera when speaking so his lips are visible moving. All dialogue in English with British accents, short and casual. The Snapchat caption bar with the white text in the picture stays exactly as it is for the whole video, like a fixed overlay. No phone in the picture. A stone spiral staircase. The girl with bushy brown hair climbs ahead with her brown bag, seen from behind. Two steps behind her the ginger boy creeps upward wrapped in the silvery cloak, looking back over his shoulder at the camera. The banister blurred in the foreground. For the first two seconds both keep climbing and the cloak slips off the ginger boy's shoulder. Then the ginger boy whispers toward the camera: \"Get down.\" He listens for two seconds as if I'm answering. He pulls the cloak back up and whispers: \"Shh.\" Above them the ting. Two seconds of the ginger boy standing in the doorway, then slowly going in. Vertical 9:16."}, {"n": 7, "title": "snape counted 25. there are 24", "attach": "Startframe = Bild „snape counted 25. there are 24“", "note": "Hermine", "img": "Exact same style as the start image: same image quality, same kind of random bad phone video, just as soft and noisy. Candid first-person video from my own eye level, handheld and a bit shaky, people cut off at the edges. Not a film still, not a studio, not a DSLR. Audio like a phone microphone with a silent dungeon classroom, bubbling cauldrons, parchment and a slow deep voice. The person holding the camera never speaks. Only the teacher in black robes with long black hair speaks, and he faces the camera when speaking so his lips are visible moving. All dialogue in English with British accents, short and casual. The Snapchat caption bar with the white text in the picture stays exactly as it is for the whole video, like a fixed overlay. No phone in the picture. The potions dungeon, candles, shelves of jars, rows of students at cauldrons seen from behind. At the front the teacher in black robes with long black hair stands with a parchment register in his hands. In front of me the girl with bushy brown hair stirs her cauldron with her head down. My own cauldron steams blurred in the foreground. For the first two seconds the teacher's eyes travel along the rows, lips moving silently, counting. Then he looks up toward the camera and says slowly: \"Twenty-five.\" He listens for two seconds as if I'm answering. He looks down at the register, back up: \"There are twenty-four names on this list.\" He walks slowly down the aisle between the cauldrons, stops beside the girl with bushy brown hair and looks down at her. She keeps stirring. He says: \"Miss Granger. See me after.\" She nods without looking up. Two seconds of him standing there and the cauldrons bubbling. Vertical 9:16."}, {"n": 8, "title": "ron gave up", "attach": "Startframe = Bild „ron gave up“", "note": "Hermine", "img": "Exact same style as the start image: same image quality, same kind of random bad phone video, just as soft and noisy. Candid first-person video from my own eye level, handheld and a bit shaky, people cut off at the edges. Not a film still, not a studio, not a DSLR. Audio like a phone microphone with a crackling fire, a groan into a cushion and pages turning. The person holding the camera never speaks. Only the boy with glasses and the girl with bushy brown hair speak, each looks at the camera when speaking so their lips are visible moving. The ginger boy only groans into the cushion. All dialogue in English with British accents, short and casual. The Snapchat caption bar with the white text in the picture stays exactly as it is for the whole video, like a fixed overlay. No phone in the picture. common room, fire going. Close in the foreground the ginger boy face down on a cushion on the sofa, only his ginger hair visible. Behind him the girl with bushy brown hair reads a book, the boy with glasses sits in the red armchair laughing with a sheet of parchment in his hand. My goblet blurred at the bottom. For the first two seconds the ginger boy doesn't move, the girl with bushy brown hair turns a page, the boy with glasses keeps laughing. Then the boy with glasses looks at the camera and says: \"He's been like that since Potions.\" He listens for two seconds as if I'm answering. The ginger boy groans into the cushion. The girl with bushy brown hair says without looking up: \"He'll be fine.\" She touches a thin gold chain at her collar and tucks it under her jumper. The boy with glasses: \"Will he?\" The girl with bushy brown hair: \"Ron. Dinner's in ten minutes.\" Two seconds of the ginger boy lifting his head an inch, looking back at her, and dropping it into the cushion again. Vertical 9:16."}, {"n": 9, "title": "she's asleep. both of her", "attach": "Startframe = Bild „she's asleep. both of her“", "note": "Hermine", "img": "Exact same style as the start image: same image quality, same kind of random bad phone video, just as soft and noisy. Candid first-person video from my own eye level, handheld and a bit shaky, people cut off at the edges. Not a film still, not a studio, not a DSLR. Audio like a phone microphone with a dark quiet room, a candle and slow breathing. The person holding the camera never speaks. Nobody speaks in this clip, there is no voice at all. All dialogue in English with British accents, short and casual. The Snapchat caption bar with the white text in the picture stays exactly as it is for the whole video, like a fixed overlay. No phone in the picture. The common room late at night, one candle. Close in front of me the girl with bushy brown hair sleeps with her head on her arm over an open book. Behind her in the armchair by the fire the same girl with bushy brown hair sleeps again, a book open on her lap. My blanket blurred in the foreground. For the first two seconds nothing moves except the candle flame and their slow breathing. Then the girl at the table shifts in her sleep and her hand slides off the book. In the same moment the girl in the armchair shifts too, the same movement, and her book slips on her lap. The candle flickers. The camera holds still. Two seconds of both of them breathing in the same rhythm. Vertical 9:16."}]}];
const INSTR = (name)=>`ANLEITUNG FÜR FLOW – WIZARDING WORLD, HERMINE-FOLGE, VIDEO-PROMPTS MIT STARTFRAME
10 Sekunden pro Clip, 9:16. Für jeden Clip das Startframe-Bild mit derselben Caption nehmen und den VIDEO-Prompt eingeben.

function clipText(w,c){return `=== ${c.note} · CLIP ${c.n}: ${c.title} ===\nStartframe: das fertige Bild mit dieser Caption\n\n[VIDEO-PROMPT]\n${c.img}\n`;}
function allText(w){return INSTR(w.name)+'\n'+w.clips.map(c=>clipText(w,c)).join('\n');}
function copy(t){const done=()=>{const el=document.getElementById('toast');el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1400);};
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,()=>fallback(t,done));}else fallback(t,done);}
function fallback(t,done){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');done();}catch(e){}document.body.removeChild(ta);}
function esc(s){return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
const tabs=document.getElementById('tabs'),host=document.getElementById('worlds');
DATA.forEach((w,i)=>{
 const t=document.createElement('button');t.className='tab';t.role='tab';t.textContent=`${w.name} · ${w.clips.length}`;t.setAttribute('aria-selected',i===0);t.onclick=()=>select(w.key);tabs.appendChild(t);
 const sec=document.createElement('section');sec.className='world'+(i===0?' on':'');sec.id='w-'+w.key;
 sec.innerHTML=`<div class="topbox"><button class="btn" data-all="${w.key}">Alle ${w.clips.length} Video-Prompts kopieren (mit Anleitung)</button><p>Wizarding World, „hermione is in two places“, Version mit Startframes: Video-Prompts auf die fertigen Bilder geschrieben. Die 9 Prompts zu den 9 finalen Bildern.</p></div>
 <ol class="clips">${w.clips.map(c=>`<li class="clip"><div class="clip-head"><span class="num">Clip ${String(c.n).padStart(2,'0')}</span><span class="cap">${esc(c.title)}</span></div>
 <div class="meta"><span class="chip">${esc(c.attach)}</span></div>
 <div class="block"><div class="block-h"><span class="lab">Video-Prompt (10 s)</span><button class="mini" data-copy="img" data-w="${w.key}" data-n="${c.n}">Kopieren</button></div><pre>${esc(c.img)}</pre><button class="more">Ganzen Prompt anzeigen</button></div>
 </li>`).join('')}</ol>`;
 host.appendChild(sec);
});
function select(k){DATA.forEach((w,i)=>{tabs.children[i].setAttribute('aria-selected',w.key===k);document.getElementById('w-'+w.key).classList.toggle('on',w.key===k);});window.scrollTo({top:0});}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.all){copy(allText(DATA.find(w=>w.key===b.dataset.all)));return;}
 if(b.dataset.copy){const w=DATA.find(x=>x.key===b.dataset.w),c=w.clips[+b.dataset.n-1];copy(b.dataset.copy==='img'?c.img:b.dataset.copy==='vid'?c.vid:clipText(w,c));return;}
 if(b.classList.contains('more')){const p=b.previousElementSibling;p.classList.toggle('open');b.textContent=p.classList.contains('open')?'Einklappen':'Ganzen Prompt anzeigen';}
});
