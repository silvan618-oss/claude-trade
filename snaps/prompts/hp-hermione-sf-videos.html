<title>Wizarding Hermione Startframe Videos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root{--bg:#f1f1ee;--surface:#ffffff;--ink:#151515;--muted:#5d5d58;--line:#dcdcd6;--accent:#f2e600;--accent-ink:#151515;--bar:rgba(0,0,0,.62);--chip:#ebebe6;--btn:#151515;--btn-ink:#f8f8f4;--mono:#2a2a2a;--focus:#1a73e8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111111;--surface:#1b1b1b;--ink:#ececea;--muted:#a0a09a;--line:#2d2d2b;--accent:#fff04d;--accent-ink:#151515;--bar:rgba(0,0,0,.7);--chip:#262624;--btn:#fff04d;--btn-ink:#151515;--mono:#d8d8d4;--focus:#8ab4f8}}
:root[data-theme="dark"]{--bg:#111111;--surface:#1b1b1b;--ink:#ececea;--muted:#a0a09a;--line:#2d2d2b;--accent:#fff04d;--accent-ink:#151515;--bar:rgba(0,0,0,.7);--chip:#262624;--btn:#fff04d;--btn-ink:#151515;--mono:#d8d8d4;--focus:#8ab4f8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:720px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
h1{font-family:"Archivo Black",Impact,sans-serif;font-size:22px;margin:0 0 10px;letter-spacing:-.01em;text-wrap:balance}
.tabs{display:flex;gap:8px}
.tab{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 12px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab:focus-visible,.btn:focus-visible,.mini:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.world{display:none}.world.on{display:block}
.topbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-block:16px;display:grid;gap:12px}
.topbox p{margin:0;color:var(--muted)}
.btn{border:0;background:var(--btn);color:var(--btn-ink);font:inherit;font-weight:600;padding:14px 16px;border-radius:12px;cursor:pointer;width:100%;font-size:16px}
.btn.sec{background:var(--chip);color:var(--ink)}
ol.clips{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.clip{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.clip-head{display:flex;align-items:center;gap:10px}
.num{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.cap{background:var(--bar);color:#fff;font-family:Helvetica,Arial,sans-serif;font-size:15px;padding:6px 12px;flex:1;text-align:center;border-radius:2px;min-width:0;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.chip{background:var(--chip);color:var(--ink);padding:3px 10px;border-radius:999px;font-weight:500;font-size:12.5px}
.note{font-size:12.5px;color:var(--muted)}
.block{display:grid;gap:6px}
.block-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lab{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.mini{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer}
.mini.primary{background:var(--btn);color:var(--btn-ink);border-color:transparent}
pre{margin:0;font-family:"JetBrains Mono",Menlo,monospace;font-size:12px;line-height:1.55;color:var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--chip);padding:10px 12px;border-radius:10px;max-height:4.7em;overflow:hidden;position:relative}
pre.open{max-height:none}
.more{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;padding:0;cursor:pointer;text-decoration:underline;justify-self:start}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:9}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>
<div class="wrap">
<header>
<h1>Snap Prompts</h1>
<div class="tabs" role="tablist" id="tabs"></div>
</header>
<div id="worlds"></div>
</div>

<script>
const DATA = [{"key": "hp", "name": "Wizarding Hermione Videos", "clips": [{"n": 1, "title": "hermione is in two places", "attach": "Startframe = Bild „hermione is in two places“", "note": "Hermine", "img": "Exact same style as the start image: same image quality, same kind of random bad phone video, just as soft and noisy. Candid first-person video from my own eye level, handheld and a bit shaky, people cut off at the edges. Not a film still, not a studio, not a DSLR. Audio like a phone microphone with the chatter of a big hall, cutlery and chewing. The person holding the camera never speaks. Only Ron Weasley and Hermione Granger speak, each looks at the camera when speaking so their lips are visible moving. All dialogue in English with British accents, short and casual. The Snapchat caption bar with the white text in the picture stays exactly as it is for the whole video, like a fixed overlay. No phone in the picture. Great Hall at breakfast. Hermione Granger eats cereal and reads a thick book propped against the jug, Ron Weasley next to her chews and glances over. My toast blurred in the foreground. For the first two seconds nothing happens, she reads, he chews. Then Ron looks at the camera and says, mouth half full: \"What. She's reading.\" He listens for two seconds as if I'm answering, and shrugs. Hermione says without looking up: \"Pass the milk.\" Ron slides the jug across. Far in the background, small and out of focus, the same girl with the same bushy hair and the same book under her arm walks past behind the tables and disappears. Nobody at our table notices. Ron says to her: \"Are you coming to Herbology or...\" She says \"Mm.\" Two seconds of her reading and him buttering toast. Vertical 9:16."}, {"n": 2, "title": "ron is not okay", "attach": "Startframe = Bild „ron is not okay“", "note": "Hermine", "img": "Exact same style as the start image: same image quality, same kind of random bad phone video, just as soft and noisy. Candid first-person video from my own eye level, handheld and a bit shaky, people cut off at the edges. Not a film still, not a studio, not a DSLR. Audio like a phone microphone with an echoing stone hall, footsteps and students talking. The person holding the camera never speaks. Only Ron Weasley and Harry Potter speak, each looks at the camera when speaking so their lips are visible moving. All dialogue in English with British accents, short and casual. The Snapchat caption bar with the white text in the picture stays exactly as it is for the whole video, like a fixed overlay. No phone in the picture. A stone hall with tall windows and two wooden doors side by side. Ron Weasley, eyes wide, points back at the doors, Harry Potter stands next to him with his hands in his pockets, students walk past blurred. The back of someone's head blurred in the foreground. For the first two seconds Ron keeps pointing from one door to the other. Then he looks at the camera and says: \"No, listen. She went in there.\" He listens for two seconds as if I'm answering. Harry looks at the camera and says: \"Okay.\" Ron: \"And then she came out of there.\" Harry: \"Ron. We've got Charms.\" and walks off. Ron looks at the doors once more and follows him. Two seconds of the two walking away, Ron looking back over his shoulder. Vertical 9:16."}, {"n": 3, "title": "she says it's the light", "attach": "Startframe = Bild „she says it's the light“", "note": "Hermine", "img": "Exact same style as the start image: same image quality, same kind of random bad phone video, just as soft and noisy. Candid first-person video from my own eye level, handheld and a bit shaky, people cut off at the edges. Not a film still, not a studio, not a DSLR. Audio like a phone microphone with library silence, a quill scratching and whispering. The person holding the camera never speaks. Only Hermione Granger and Ron Weasley speak, each looks at the camera when speaking so their lips are visible moving. All dialogue in English with British accents, short and casual. The Snapchat caption bar with the white text in the picture stays exactly as it is for the whole video, like a fixed overlay. No phone in the picture. The library, dark shelves, green lamps. Hermione Granger writes on a parchment behind a stack of books, Ron Weasley sits next to her with his chin on his fists staring at her. My open book blurred in the foreground. For the first two seconds she writes and he stares. Then Ron looks at the camera and whispers: \"Ask her.\" He listens for two seconds as if I'm answering. Hermione says without looking up: \"Ask me what.\" Ron: \"Nothing.\" Hermione looks up at the camera: \"It's the light in the hall. Ask anyone.\" and goes back to writing. Ron looks at the camera and says nothing. Two seconds of her quill scratching and him sitting back. Vertical 9:16."}, {"n": 4, "title": "arithmancy AND divination", "attach": "Startframe = Bild „arithmancy AND divination“", "note": "Hermine", "img": "Exact same style as the start image: same image quality, same kind of random bad phone video, just as soft and noisy. Candid first-person video from my own eye level, handheld and a bit shaky, people cut off at the edges. Not a film still, not a studio, not a DSLR. Audio like a phone microphone with a quiet common room, parchment rustling and a finger tapping. The person holding the camera never speaks. Nobody speaks in this clip, there is no voice at all. All dialogue in English with British accents, short and casual. The Snapchat caption bar with the white text in the picture stays exactly as it is for the whole video, like a fixed overlay. No phone in the picture. A wooden table with two handwritten timetables side by side, both headed Hermione Granger, a third one lying upside down further back, a pewter goblet and a quill. My own hand in the frame. For the first two seconds my finger rests on the word Arithmancy on the left sheet. Then it slides across to the word Divination on the right sheet, taps it twice, goes back to Arithmancy, and taps again. My hand picks up both sheets, holds them side by side close to the lens so both entries are readable, then lays them back down. Two seconds of the hand resting flat between the two sheets. The camera stays low over the table the whole time. Vertical 9:16."}, {"n": 5, "title": "we followed her", "attach": "Startframe = Bild „we followed her“", "note": "Hermine", "img": "Exact same style as the start image: same image quality, same kind of random bad phone video, just as soft and noisy. Candid first-person video from my own eye level, handheld and a bit shaky, people cut off at the edges. Not a film still, not a studio, not a DSLR. Audio like a phone microphone with a stone stairwell, footsteps and whispering. The person holding the camera never speaks. Only Ron Weasley and Harry Potter speak, each looks at the camera when speaking so their lips are visible moving. All dialogue in English with British accents, short and casual. The Snapchat caption bar with the white text in the picture stays exactly as it is for the whole video, like a fixed overlay. No phone in the picture. A stone spiral staircase. Hermione Granger climbs ahead with her bag, seen from behind. Two steps behind her Harry Potter walks under the silvery invisibility cloak, and Ron Weasley next to him looks back over his shoulder at the camera. The banister blurred in the foreground. For the first two seconds all three keep climbing. Then Ron whispers toward the camera: \"Get down.\" He listens for two seconds as if I'm answering. Harry whispers from under the cloak: \"She's not looking.\" Ron: \"Shh.\" Above them Hermione stops on the landing, both boys freeze. She takes a small gold chain out from under her collar, looks at it, and turns the corner. Ron whispers: \"Go. Go.\" Two seconds of the two hurrying up after her, the camera following. Vertical 9:16."}, {"n": 8, "title": "ron gave up", "attach": "Startframe = Bild „ron gave up“", "note": "Hermine", "img": "Exact same style as the start image: same image quality, same kind of random bad phone video, just as soft and noisy. Candid first-person video from my own eye level, handheld and a bit shaky, people cut off at the edges. Not a film still, not a studio, not a DSLR. Audio like a phone microphone with a crackling fire, a groan into a cushion and pages turning. The person holding the camera never speaks. Only Harry Potter and Hermione Granger speak, each looks at the camera when speaking so their lips are visible moving. Ron only groans into the cushion. All dialogue in English with British accents, short and casual. The Snapchat caption bar with the white text in the picture stays exactly as it is for the whole video, like a fixed overlay. No phone in the picture. Gryffindor common room, fire going. Close in the foreground the back of Ron Weasley's ginger head, face down in the arm of the sofa. Behind him Hermione Granger reads a book, Harry Potter sits next to her laughing. My goblet blurred at the bottom. For the first two seconds Ron doesn't move, Hermione turns a page, Harry keeps laughing. Then Harry looks at the camera and says: \"He's been like that since Potions.\" He listens for two seconds as if I'm answering. Ron groans into the cushion. Hermione says without looking up: \"He'll be fine.\" She touches a thin gold chain at her collar and tucks it under her jumper. Harry: \"Will he?\" Hermione: \"Ron. Dinner's in ten minutes.\" Two seconds of Ron lifting his head an inch, looking back at her, and dropping it into the cushion again. Vertical 9:16."}, {"n": 9, "title": "she's asleep. both of her", "attach": "Startframe = Bild „she's asleep. both of her“", "note": "Hermine", "img": "Exact same style as the start image: same image quality, same kind of random bad phone video, just as soft and noisy. Candid first-person video from my own eye level, handheld and a bit shaky, people cut off at the edges. Not a film still, not a studio, not a DSLR. Audio like a phone microphone with a dark quiet room, a candle and slow breathing. The person holding the camera never speaks. Nobody speaks in this clip, there is no voice at all. All dialogue in English with British accents, short and casual. The Snapchat caption bar with the white text in the picture stays exactly as it is for the whole video, like a fixed overlay. No phone in the picture. The common room late at night, one candle. Close in front of me Hermione Granger sleeps with her head on her arm over an open book. Behind her in the armchair by the fire the same Hermione Granger sleeps again, a book open on her lap. My blanket blurred in the foreground. For the first two seconds nothing moves except the candle flame and their slow breathing. Then the girl at the table shifts in her sleep and her hand slides off the book. In the same moment the girl in the armchair shifts too, the same movement, and her book slips on her lap. The candle flickers. The camera holds still. Two seconds of both of them breathing in the same rhythm. Vertical 9:16."}]}];
const INSTR = (name)=>`ANLEITUNG FÜR FLOW – WIZARDING WORLD, HERMINE-FOLGE, VIDEO-PROMPTS MIT STARTFRAME
10 Sekunden pro Clip, 9:16. Für jeden Clip das Startframe-Bild mit derselben Caption nehmen und den VIDEO-Prompt eingeben.
Dialoge auf Englisch mit britischem Akzent. Der Kamerahalter spricht nie. Balken bleibt stehen.
`;
function clipText(w,c){return `=== ${c.note} · CLIP ${c.n}: ${c.title} ===\nStartframe: das fertige Bild mit dieser Caption\n\n[VIDEO-PROMPT]\n${c.img}\n`;}
function allText(w){return INSTR(w.name)+'\n'+w.clips.map(c=>clipText(w,c)).join('\n');}
function copy(t){const done=()=>{const el=document.getElementById('toast');el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1400);};
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,()=>fallback(t,done));}else fallback(t,done);}
function fallback(t,done){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');done();}catch(e){}document.body.removeChild(ta);}
function esc(s){return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
const tabs=document.getElementById('tabs'),host=document.getElementById('worlds');
DATA.forEach((w,i)=>{
 const t=document.createElement('button');t.className='tab';t.role='tab';t.textContent=`${w.name} · ${w.clips.length}`;t.setAttribute('aria-selected',i===0);t.onclick=()=>select(w.key);tabs.appendChild(t);
 const sec=document.createElement('section');sec.className='world'+(i===0?' on':'');sec.id='w-'+w.key;
 sec.innerHTML=`<div class="topbox"><button class="btn" data-all="${w.key}">Alle ${w.clips.length} Video-Prompts kopieren (mit Anleitung)</button><p>Wizarding World, „hermione is in two places“, Version mit Startframes: Video-Prompts auf die fertigen Bilder geschrieben. Clip 6 und 7 kommen dazu, sobald Bilder da sind.</p></div>
 <ol class="clips">${w.clips.map(c=>`<li class="clip"><div class="clip-head"><span class="num">Clip ${String(c.n).padStart(2,'0')}</span><span class="cap">${esc(c.title)}</span></div>
 <div class="meta"><span class="chip">${esc(c.attach)}</span></div>
 <div class="block"><div class="block-h"><span class="lab">Video-Prompt (10 s)</span><button class="mini" data-copy="img" data-w="${w.key}" data-n="${c.n}">Kopieren</button></div><pre>${esc(c.img)}</pre><button class="more">Ganzen Prompt anzeigen</button></div>
 </li>`).join('')}</ol>`;
 host.appendChild(sec);
});
function select(k){DATA.forEach((w,i)=>{tabs.children[i].setAttribute('aria-selected',w.key===k);document.getElementById('w-'+w.key).classList.toggle('on',w.key===k);});window.scrollTo({top:0});}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.all){copy(allText(DATA.find(w=>w.key===b.dataset.all)));return;}
 if(b.dataset.copy){const w=DATA.find(x=>x.key===b.dataset.w),c=w.clips[+b.dataset.n-1];copy(b.dataset.copy==='img'?c.img:b.dataset.copy==='vid'?c.vid:clipText(w,c));return;}
 if(b.classList.contains('more')){const p=b.previousElementSibling;p.classList.toggle('open');b.textContent=p.classList.contains('open')?'Einklappen':'Ganzen Prompt anzeigen';}
});
</script>
