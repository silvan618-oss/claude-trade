<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root{--bg:#f1f1ee;--surface:#ffffff;--ink:#151515;--muted:#5d5d58;--line:#dcdcd6;--accent:#f2e600;--accent-ink:#151515;--bar:rgba(0,0,0,.62);--chip:#ebebe6;--btn:#151515;--btn-ink:#f8f8f4;--mono:#2a2a2a;--focus:#1a73e8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111111;--surface:#1b1b1b;--ink:#ececea;--muted:#a0a09a;--line:#2d2d2b;--accent:#fff04d;--accent-ink:#151515;--bar:rgba(0,0,0,.7);--chip:#262624;--btn:#fff04d;--btn-ink:#151515;--mono:#d8d8d4;--focus:#8ab4f8}}
:root[data-theme="dark"]{--bg:#111111;--surface:#1b1b1b;--ink:#ececea;--muted:#a0a09a;--line:#2d2d2b;--accent:#fff04d;--accent-ink:#151515;--bar:rgba(0,0,0,.7);--chip:#262624;--btn:#fff04d;--btn-ink:#151515;--mono:#d8d8d4;--focus:#8ab4f8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:720px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
h1{font-family:"Archivo Black",Impact,sans-serif;font-size:22px;margin:0 0 10px;letter-spacing:-.01em;text-wrap:balance}
.tabs{display:flex;gap:8px}
.tab{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 12px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab:focus-visible,.btn:focus-visible,.mini:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.world{display:none}.world.on{display:block}
.topbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-block:16px;display:grid;gap:12px}
.topbox p{margin:0;color:var(--muted)}
.btn{border:0;background:var(--btn);color:var(--btn-ink);font:inherit;font-weight:600;padding:14px 16px;border-radius:12px;cursor:pointer;width:100%;font-size:16px}
.btn.sec{background:var(--chip);color:var(--ink)}
ol.clips{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.clip{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.clip-head{display:flex;align-items:center;gap:10px}
.num{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.cap{background:var(--bar);color:#fff;font-family:Helvetica,Arial,sans-serif;font-size:15px;padding:6px 12px;flex:1;text-align:center;border-radius:2px;min-width:0;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.chip{background:var(--chip);color:var(--ink);padding:3px 10px;border-radius:999px;font-weight:500;font-size:12.5px}
.note{font-size:12.5px;color:var(--muted)}
.block{display:grid;gap:6px}
.block-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lab{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.mini{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer}
.mini.primary{background:var(--btn);color:var(--btn-ink);border-color:transparent}
pre{margin:0;font-family:"JetBrains Mono",Menlo,monospace;font-size:12px;line-height:1.55;color:var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--chip);padding:10px 12px;border-radius:10px;max-height:4.7em;overflow:hidden;position:relative}
pre.open{max-height:none}
.more{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;padding:0;cursor:pointer;text-decoration:underline;justify-self:start}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:9}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>

om the sheet and @EVANS keeps her eyes closed, as if they heard me. Then @PRONGS looks at the camera, clears his throat and reads out with lips moving: \"Let messing blord the bird matter, the corrected they jow tomor.\" He listens for two seconds as if I'm answering. @EVANS opens her eyes, looks at the camera and says: \"It doesn't rhyme. It doesn't have words.\" @MOONY takes his hand off his face, looks at the camera and says: \"I told him to sleep on it. He slept on it. This is after.\" @PRONGS holds the sheet out to @EVANS and says: \"Keep it. Read it later. It's better later.\" @EVANS takes the sheet, tucks it into her book and keeps walking. Two seconds pass with @PRONGS looking at the camera with huge hopeful eyes and @MOONY shaking his head. Flat grey light. Vertical 9:16. No watermark, no visible phone or camera."}, {"n": 4, "title": "she gave it back with corrections", "attach": "Startframe = Bild „she gave it back with corrections“, Referenzen: @PRONGS, @PADFOOT", "note": "Lily", "img": "Candid first-person video from my own eye level, as if I just raised my old iPhone across the table and hit record. 2015 smartphone video quality: soft focus, visible noise and slight compression, motion blur, uneven handheld framing that shakes in my hand, people cut off at the edges, no flash, no filter, audio like a phone microphone with a busy common room, a fire, parchment crackling and one boy laughing so hard he wheezes. The person holding the camera never speaks and makes no sound. The only people who speak are @PRONGS and @PADFOOT, and each turns their face to the camera before speaking so their lips are visible moving with every word. All dialogue is spoken in English with natural British accents, casual teenage talk. The Snapchat caption bar with the white text in the photo stays exactly as it is on screen for the whole video, like a fixed overlay. A stone common room at night, fire and candles behind. In the foreground a sheet of parchment is held up close to er speaks and makes no sound. The only people who speak are @PADFOOT, @MOONY and @PRONGS, and each turns their face to the camera before speaking so their lips are visible moving with every word. All dialogue is spoken in English with natural British accents, casual teenage talk. The Snapchat caption bar with the white text in the photo stays exactly as it is on screen for the whole video, like a fixed overlay. A wide green pitch under a grey sky. @PRONGS lies flat on his back on the grass in a muddy black robe with his glasses crooked, a broomstick beside him, eyes closed. @PADFOOT stands over him with his hand over his mouth trying not to laugh, @MOONY crouches at his side looking worried, and Peter, the short chubby blond boy, stands at the right edge eating a pasty. The toe of my own trainer is blurred large at the bottom. For the first two seconds @PRONGS doesn't move, @PADFOOT's shoulders shake with silent laughter and Peter keeps chewing, as if they heard me. Then @MOONY looks up at the camera and says with lips moving: \"He's fine. He's breathing. He's just embarrassed.\" He listens for two seconds as if I'm answering. @PADFOOT takes his hand off his mouth and says: \"She was watching. From the stands. The whole time.\" @PRONGS opens his eyes, looks at the camera without lifting his head and says: \"Did she see the loop?\" @PADFOOT says: \"She saw the ground.\" @PRONGS closes his eyes again. Peter takes another bite. Two seconds pass with @MOONY patting @PRONGS's shoulder. Flat grey daylight. Vertical 9:16. No watermark, no visible phone or camera."}, {"n": 7, "title": "hospital wing. she visited.", "attach": "Startframe = Bild „hospital wing. she visited.“, Referenzen: @EVANS, @PRONGS", "note": "Lily", "img": "Candid first-person video from my own eye level, as if I just raised my old iPhone from the next bed and hit record. 2015 smartphone video quality: soft focus, visible noise and slight compression, motion blur, uneven handheld framing that shakes in m ok back over her face and @PRONGS smiling at the fire. Warm firelight. Vertical 9:16. No watermark, no visible phone or camera."}, {"n": 9, "title": "padfoot lost 3 galleons", "attach": "Startframe = Bild „padfoot lost 3 galleons“, Referenzen: @PADFOOT, @MOONY (Peter wird beschrieben)", "note": "Lily", "img": "Candid first-person video from my own eye level, as if I just raised my old iPhone in the cloister and hit record. 2015 smartphone video quality: soft focus, visible noise and slight compression, motion blur, uneven handheld framing that shakes in my hand, people cut off at the edges, no flash, no filter, audio like a phone microphone with an echoing stone cloister, gold coins clinking and a boy giggling. The person holding the camera never speaks and makes no sound. The only people who speak are @PADFOOT and Peter, and each turns their face to the camera before speaking so their lips are visible moving with every word. All dialogue is spoken in English with natural British accents, casual teenage talk. The Snapchat caption bar with the white text in the photo stays exactly as it is on screen for the whole video, like a fixed overlay. A stone cloister with arched windows in grey daylight. @PADFOOT stands with a sour face dropping gold coins one by one into the open hand of Peter, the short chubby blond boy, who grins from ear to ear. Behind them @MOONY walks past looking at the floor. My own sleeve in a red-gold striped jumper is blurred in the foreground. For the first two seconds @PADFOOT keeps dropping the coins slowly, one at a time, and Peter's grin gets wider, as if they heard me. Then @PADFOOT looks at the camera and says with lips moving: \"Maybe. She said maybe. Who bets on maybe.\" He listens for two seconds as if I'm answering. Peter closes his hand around the coins, looks at the camera and says: \"I did. Three galleons.\" @PADFOOT says: \"It's not even an answer.\" Peter says: \"It is with her.\" @MOONY, walking past, says nothing but holds up one const INSTR = (name)=>`ANLEITUNG FÜR FLOW – MARAUDERS, LILY-FOLGE, VIDEO-PROMPTS

function clipText(w,c){return `=== ${c.note} · CLIP ${c.n}: ${c.title} ===\nStartframe: das fertige Bild mit dieser Caption\n\n[VIDEO-PROMPT]\n${c.img}\n`;}

function copy(t){const done=()=>{const el=document.getElementById('toast');el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1400);};
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,()=>fallback(t,done));}else fallback(t,done);}

 </li>`).join('')}</ol>`;

document.addEventListener('click',e=>{
