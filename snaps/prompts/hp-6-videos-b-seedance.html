<title>Wizarding Videos Sechserpack 2 Seedance</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root{--bg:#f1f1ee;--surface:#ffffff;--ink:#151515;--muted:#5d5d58;--line:#dcdcd6;--accent:#f2e600;--accent-ink:#151515;--bar:rgba(0,0,0,.62);--chip:#ebebe6;--btn:#151515;--btn-ink:#f8f8f4;--mono:#2a2a2a;--focus:#1a73e8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111111;--surface:#1b1b1b;--ink:#ececea;--muted:#a0a09a;--line:#2d2d2b;--accent:#fff04d;--accent-ink:#151515;--bar:rgba(0,0,0,.7);--chip:#262624;--btn:#fff04d;--btn-ink:#151515;--mono:#d8d8d4;--focus:#8ab4f8}}
:root[data-theme="dark"]{--bg:#111111;--surface:#1b1b1b;--ink:#ececea;--muted:#a0a09a;--line:#2d2d2b;--accent:#fff04d;--accent-ink:#151515;--bar:rgba(0,0,0,.7);--chip:#262624;--btn:#fff04d;--btn-ink:#151515;--mono:#d8d8d4;--focus:#8ab4f8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:720px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
h1{font-family:"Archivo Black",Impact,sans-serif;font-size:22px;margin:0 0 10px;letter-spacing:-.01em;text-wrap:balance}
.tabs{display:flex;gap:8px}
.tab{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 12px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab:focus-visible,.btn:focus-visible,.mini:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.world{display:none}.world.on{display:block}
.topbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-block:16px;display:grid;gap:12px}
.topbox p{margin:0;color:var(--muted)}
.btn{border:0;background:var(--btn);color:var(--btn-ink);font:inherit;font-weight:600;padding:14px 16px;border-radius:12px;cursor:pointer;width:100%;font-size:16px}
.btn.sec{background:var(--chip);color:var(--ink)}
ol.clips{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.clip{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.clip-head{display:flex;align-items:center;gap:10px}
.num{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.cap{background:var(--bar);color:#fff;font-family:Helvetica,Arial,sans-serif;font-size:15px;padding:6px 12px;flex:1;text-align:center;border-radius:2px;min-width:0;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.chip{background:var(--chip);color:var(--ink);padding:3px 10px;border-radius:999px;font-weight:500;font-size:12.5px}
.note{font-size:12.5px;color:var(--muted)}
.block{display:grid;gap:6px}
.block-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lab{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.mini{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer}
.mini.primary{background:var(--btn);color:var(--btn-ink);border-color:transparent}
pre{margin:0;font-family:"JetBrains Mono",Menlo,monospace;font-size:12px;line-height:1.55;color:var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--chip);padding:10px 12px;border-radius:10px;max-height:4.7em;overflow:hidden;position:relative}
pre.open{max-height:none}
.more{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;padding:0;cursor:pointer;text-decoration:underline;justify-self:start}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:9}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>
<div class="wrap">
<header>
<h1>Snap Prompts</h1>
<div class="tabs" role="tablist" id="tabs"></div>
</header>

</div>

<script>
const DATA = [{"key": "hp", "name": "Wizarding World Videos", "clips": [{"n": 1, "title": "the owl hates him", "attach": "Startframe: Frühstück in der großen Halle, ein Junge mit runder Brille und schwarzen Haaren hält den Finger hoch, eine weiße Schneeeule auf dem Tisch hat ihn gerade gezwickt, mein Toast unscharf im Vordergrund.", "note": "Video 1", "img": "Candid first-person video from my own eye level, as if I just raised my old iPhone across the breakfast table and hit record. 2015 smartphone video quality: soft focus, visible noise and slight compression, motion blur, uneven handheld framing that shakes in my hand, people cut off at the edges, no flash, no filter, audio like a phone microphone with the echoing chatter of a huge hall, cutlery, feathers rustling and an angry clicking beak. The person holding the camera never speaks and makes no sound. The owl never speaks, it only clicks, hoots and flaps. The only person who speaks is the boy with round glasses, and he faces the camera when speaking so his lips are visible moving with every word. All dialogue is spoken in English with natural British accents, casual teenage talk. No caption, no text overlay, no bar on the video. A vast candlelit dining hall at breakfast. Across the table a teenage boy with messy black hair, round glasses and a red-gold tie holds up his finger and stares at it, while a big white snowy owl stands on the table between the plates glaring at him. My toast is blurred in the foreground. For the first two seconds he keeps staring at his finger and the owl clicks its beak at him, as if he heard me. Then he looks at the camera and says with lips moving: \"She doesn't hate me. She's just moody.\" He listens for two seconds as if I'm answering, then reaches for the owl again, the owl snaps at his hand and he yanks it back, saying: \"Okay. She hates me a bit.\" He listens again, then pushes his bacon toward the owl with his fork and says: \"Look, bacon. We're friends. See?\" The owl steps on the bacon, looks at him and hoots once, and he shrugs at the camera. Two seconds pass while he sucks his finger and the owl eats. Warm candlelight, grey windows. Vertical 9:16. No watermark, no visible phone or camera."}, {"n": 2, "title": "she colour coded the whole week", "attach": "Startframe: Bibliothek, ein Mädchen mit buschigen braunen Haaren sitzt vor einem riesigen Stundenplan mit bunten Feldern, mehrere Bücher aufgeschlagen, mein Ellbogen und mein Buch unscharf im Vordergrund.", "note": "Video 1", "img": "Candid first-person video from my own eye level, as if I just raised my old iPhone across the library table and hit record. 2015 smartphone video quality: soft focus, visible noise and slight compression, motion blur, uneven handheld framing that shakes in my hand, people cut off at the edges, no flash, no filter, audio like a phone microphone with library silence, a quill scratching, pages turning and a whispered argument. The person holding the camera never speaks and makes no sound. The only person who speaks is the girl with bushy hair, and she faces the camera when speaking so her lips are visible moving with every word. All dialogue is spoken in English with natural British accents, casual teenage talk. No caption, no text overlay, no bar on the video. A dark library with tall bookshelves and green lamps. Across the table a teenage girl with big bushy brown hair and a red-gold tie bends over a huge timetable covered in coloured blocks, a quill in her hand, six open books around her. My elbow and my book are blurred in the foreground. For the first two seconds she keeps colouring in a block with her tongue between her teeth, as if she heard me but doesn't care. Then she looks up at the camera, whispering, lips moving: \"It's not a lot. It's organised.\" She listens for two seconds as if I'm answering, taps the timetable with the quill and whispers: \"Blue is revision, green is more revision.\" She listens again, then holds up a small folded copy of the timetable toward the lens and says: \"I made you one too.\" A librarian hisses shush from somewhere behind me, she drops her voice even lower and mouths sorry, then goes back to colouring. Two seconds pass with her head down again. Green lamp light, dark corners. Vertical 9:16. No watermark, no visible phone or camera."}, {"n": 3, "title": "it was earwax", "attach": "Startframe: Gemeinschaftsraum, ein Junge mit roten Haaren sitzt mit verzogenem Gesicht auf dem Sofa, eine offene bunte Bohnenschachtel auf dem Knie, mein Knie und die Sofalehne unscharf im Vordergrund.", "note": "Video 1", "img": "Candid first-person video from my own eye level, as if I just raised my old iPhone from the other end of the sofa and hit record. 2015 smartphone video quality: soft focus, visible noise and slight compression, motion blur, uneven handheld framing that shakes in my hand, people cut off at the edges, no flash, no filter, audio like a phone microphone with a crackling fire, a cardboard box rattling and someone gagging. The person holding the camera never speaks and makes no sound. The only person who speaks is the ginger boy on the sofa, and he faces the camera when speaking so his lips are visible moving with every word. All dialogue is spoken in English with natural British accents, casual teenage talk. No caption, no text overlay, no bar on the video. A warm red common room at night with a fire. On the sofa a tall teenage boy with ginger hair and a red-gold tie sits with his face screwed up, chewing slowly, an open box of multicoloured jelly beans on his knee. My knee and the arm of the sofa are blurred in the foreground. For the first two seconds he keeps chewing with his eyes shut and shudders, as if he heard me. Then he looks at the camera and says with his mouth still half full, lips moving: \"Earwax. Definitely earwax.\" He listens for two seconds as if I'm answering, swallows hard, digs into the box and holds up a green one toward the lens: \"This one's grass. Or bogey.\" He listens again, pops it in, chews twice, freezes and says: \"Bogey.\" He spits it into his hand, throws it into the fire, and holds the box out toward the camera: \"Your turn.\" Two seconds pass with him shaking the box at me and grinning. Warm orange firelight. Vertical 9:16. No watermark, no visible phone or camera."}, {"n": 4, "title": "he lost to a first year", "attach": "Startframe: Gemeinschaftsraum, ein blasser Junge mit zurückgegelten weißblonden Haaren starrt auf ein ganz normales Schachbrett mit schwarz-weißen Feldern und grauen Steinfiguren, gegenüber ein winziger Erstklässler mit erhobenen Armen, mein Becher unscharf im Vordergrund.", "note": "Video 1", "img": "Candid first-person video from my own eye level, as if I just raised my old iPhone next to the chess table and hit record. 2015 smartphone video quality: soft focus, visible noise and slight compression, motion blur, uneven handheld framing that shakes in my hand, people cut off at the edges, no flash, no filter, audio like a phone microphone with a quiet common room, small stone chess pieces clicking and a little kid cheering. The person holding the camera never speaks and makes no sound. The only people who speak are the pale blond boy and the small first-year boy, and each turns his face to the camera before speaking so his lips are visible moving with every word. All dialogue is spoken in English with natural British accents, casual teenage talk. No caption, no text overlay, no bar on the video. A dim green-lit common room with leather sofas. At a small table a pale teenage boy with slicked-back white-blond hair and a green-silver tie stares down at an ordinary square chessboard with 64 black and white squares and grey stone chess pieces, the same board for the whole video, where his king lies in pieces, while opposite him a tiny first-year boy in oversized robes has both arms in the air. My goblet is blurred in the foreground. For the first two seconds the blond boy keeps staring at the board and the little boy bounces in his seat, as if they heard me. Then the blond boy looks at the camera with a sour face and says, lips moving: \"He cheated. Obviously.\" The little boy turns to the camera, beaming: \"I didn't cheat.\" The blond boy listens for two seconds as if I'm answering, then snaps: \"Delete that.\" He listens again, then sweeps the pieces off the black and white board with one arm and says: \"Best of three.\" The little boy sets his pieces back up on the same black and white board at top speed and says to the camera: \"He said that last time.\" Two seconds pass with the blond boy glaring at me over the board. Cold greenish light. Vertical 9:16. No watermark, no visible phone or camera."}, {"n": 5, "title": "she's feeding something", "attach": "Startframe: Waldrand bei grauem Licht, ein Mädchen mit langen hellblonden Haaren und blauer Krawatte hält ein Stück Fleisch in die leere Luft, mein Ärmel und ein Ast unscharf im Vordergrund.", "note": "Video 1", "img": "Candid first-person video from my own eye level, as if I just raised my old iPhone at the edge of the forest and hit record. 2015 smartphone video quality: soft focus, visible noise and slight compression, motion blur, uneven handheld framing that shakes in my hand, people cut off at the edges, no flash, no filter, audio like a phone microphone with wind in the trees, twigs snapping, a soft wet chewing sound from nowhere and birds. The person holding the camera never speaks and makes no sound. The only person who speaks is the blonde girl, and she faces the camera when speaking so her lips are visible moving with every word. All dialogue is spoken in English with natural British accents, casual teenage talk. No caption, no text overlay, no bar on the video. The edge of a dark forest under grey daylight, wet grass, tall trees. A teenage girl with long wavy pale blonde hair, a blue-bronze tie and a scruffy cardigan stands holding a piece of raw meat out at arm's length into empty air, smiling calmly at nothing. My sleeve and a branch are blurred in the foreground. For the first two seconds she keeps holding the meat out, then it is tugged out of her hand by nothing and vanishes into the air with a chewing sound, and she doesn't flinch. Then she looks at the camera and says, lips moving: \"You can't see him. That's alright.\" She listens for two seconds as if I'm answering, strokes the empty air next to her at head height and says: \"He's very gentle. He likes ears.\" She listens again, then takes a second piece of meat out of her pocket and holds it out toward the lens: \"You can try. Just don't scream, they don't like it.\" The grass in front of her flattens in the shape of a large hoof and the camera jerks back a step. Two seconds pass with her smiling at me and holding out the meat. Flat grey light, mist between the trees. Vertical 9:16. No watermark, no visible phone or camera."}, {"n": 6, "title": "he says he's fine", "attach": "Startframe: Vor einer Holzhütte, ein sehr großer, breiter Mann (ein normaler Mensch, nur riesig) mit buschigem schwarzem Bart und Mantel sitzt auf der Treppe mit einem Verband um die Hand, ein riesiger Hund liegt neben ihm, meine Mütze unscharf im Vordergrund.", "note": "Video 1", "img": "Candid first-person video from my own eye level, as if I just raised my old iPhone in front of the hut and hit record. 2015 smartphone video quality: soft focus, visible noise and slight compression, motion blur, uneven handheld framing that shakes in my hand, people cut off at the edges, no flash, no filter, audio like a phone microphone with wind, a big dog panting, chickens somewhere and a deep rumbling voice. The person holding the camera never speaks and makes no sound. The dog never speaks, it only pants and whines. The only person who speaks is the very tall bearded man, an ordinary human being, not a creature, and he faces the camera when speaking so his lips are visible moving with every word. All dialogue is spoken in English with natural British accents, casual teenage talk. No caption, no text overlay, no bar on the video. A wooden hut at the edge of the forest under grey sky, a pumpkin patch. On the front steps sits a very tall, very broad man, clearly a normal human with a kind friendly face, warm dark eyes and rosy cheeks, just much bigger than a student, with long bushy black hair, a bushy black beard and a big brown moleskin coat. He is a man, not a monster, not a creature, no fangs, no fur, normal human hands. He sits with one hand wrapped in a bloody bandage, a giant black boarhound lying across his boots. My beanie is blurred in the bottom corner. For the first two seconds he keeps looking at the bandage and pats the dog with the other hand, as if he heard me. Then he looks at the camera and says in a deep gentle voice, lips moving: \"S'nothing. He's only a baby.\" He listens for two seconds as if I'm answering, glances back at the hut where something thumps against the door, and says: \"Don't go in there, mind.\" He listens again, then holds up the bandaged hand and says: \"Still got all me fingers. Mostly.\" The dog lifts its head, whines at the hut door, and the man pushes it back down with a laugh. Two seconds pass with him grinning at me and the door thumping again. Flat grey daylight. Vertical 9:16. No watermark, no visible phone or camera."}]}];
const INSTR = (name)=>`ANLEITUNG FÜR FLOW – WIZARDING WORLD, 6 NEUE VIDEO-PROMPTS, SEEDANCE-VERSION OHNE CAPTION-BALKEN
Omni Flash 1.1, 10 Sekunden, 9:16. Für jeden Clip das Snap-Bild mit derselben Caption als Startframe nehmen und den VIDEO-Prompt eingeben.
Alle Dialoge auf Englisch mit britischem Akzent. Der Kamerahalter spricht nie. Jeder Satz gehört zu der sichtbaren Person, die im Prompt genannt ist, mit sichtbar bewegtem Mund.
`;
function clipText(w,c){return `=== ${c.note} · CLIP ${c.n}: ${c.title} ===\nStartframe: das fertige Bild mit dieser Caption\n\n[VIDEO-PROMPT]\n${c.img}\n`;}
function allText(w){return INSTR(w.name)+'\n'+w.clips.map(c=>clipText(w,c)).join('\n');}
function copy(t){const done=()=>{const el=document.getElementById('toast');el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1400);};
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,()=>fallback(t,done));}else fallback(t,done);}
function fallback(t,done){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');done();}catch(e){}document.body.removeChild(ta);}
function esc(s){return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
const tabs=document.getElementById('tabs'),host=document.getElementById('worlds');
DATA.forEach((w,i)=>{
 const t=document.createElement('button');t.className='tab';t.role='tab';t.textContent=`${w.name} · ${w.clips.length}`;t.setAttribute('aria-selected',i===0);t.onclick=()=>select(w.key);tabs.appendChild(t);
 const sec=document.createElement('section');sec.className='world'+(i===0?' on':'');sec.id='w-'+w.key;
 sec.innerHTML=`<div class="topbox"><button class="btn" data-all="${w.key}">Alle ${w.clips.length} Video-Prompts kopieren (mit Anleitung)</button><p>Wizarding World, 6 neue Video-Prompts, Seedance-Version ohne Caption-Balken. Unter jeder Caption steht kurz, was auf dem Startframe zu sehen sein muss.</p></div>
 <ol class="clips">${w.clips.map(c=>`<li class="clip"><div class="clip-head"><span class="num">${c.note.replace('Video ','V')}·${String(c.n).padStart(2,'0')}</span><span class="cap">${esc(c.title)}</span></div>
 <div class="meta"><span class="chip">${esc(c.attach)}</span></div>
 <div class="block"><div class="block-h"><span class="lab">Video-Prompt (10 s)</span><button class="mini" data-copy="img" data-w="${w.key}" data-n="${c.n}">Kopieren</button></div><pre>${esc(c.img)}</pre><button class="more">Ganzen Prompt anzeigen</button></div>
 </li>`).join('')}</ol>`;
 host.appendChild(sec);
});
function select(k){DATA.forEach((w,i)=>{tabs.children[i].setAttribute('aria-selected',w.key===k);document.getElementById('w-'+w.key).classList.toggle('on',w.key===k);});window.scrollTo({top:0});}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.all){copy(allText(DATA.find(w=>w.key===b.dataset.all)));return;}
 if(b.dataset.copy){const w=DATA.find(x=>x.key===b.dataset.w),c=w.clips[+b.dataset.n-1];copy(b.dataset.copy==='img'?c.img:b.dataset.copy==='vid'?c.vid:clipText(w,c));return;}
 if(b.classList.contains('more')){const p=b.previousElementSibling;p.classList.toggle('open');b.textContent=p.classList.contains('open')?'Einklappen':'Ganzen Prompt anzeigen';}
});
</script>
