<title>Marauders Folge 1 Videos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root{--bg:#f1f1ee;--surface:#ffffff;--ink:#151515;--muted:#5d5d58;--line:#dcdcd6;--accent:#f2e600;--accent-ink:#151515;--bar:rgba(0,0,0,.62);--chip:#ebebe6;--btn:#151515;--btn-ink:#f8f8f4;--mono:#2a2a2a;--focus:#1a73e8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111111;--surface:#1b1b1b;--ink:#ececea;--muted:#a0a09a;--line:#2d2d2b;--accent:#fff04d;--accent-ink:#151515;--bar:rgba(0,0,0,.7);--chip:#262624;--btn:#fff04d;--btn-ink:#151515;--mono:#d8d8d4;--focus:#8ab4f8}}
:root[data-theme="dark"]{--bg:#111111;--surface:#1b1b1b;--ink:#ececea;--muted:#a0a09a;--line:#2d2d2b;--accent:#fff04d;--accent-ink:#151515;--bar:rgba(0,0,0,.7);--chip:#262624;--btn:#fff04d;--btn-ink:#151515;--mono:#d8d8d4;--focus:#8ab4f8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:720px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
h1{font-family:"Archivo Black",Impact,sans-serif;font-size:22px;margin:0 0 10px;letter-spacing:-.01em;text-wrap:balance}
.tabs{display:flex;gap:8px}
.tab{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 12px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab:focus-visible,.btn:focus-visible,.mini:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.world{display:none}.world.on{display:block}
.topbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-block:16px;display:grid;gap:12px}
.topbox p{margin:0;color:var(--muted)}
.btn{border:0;background:var(--btn);color:var(--btn-ink);font:inherit;font-weight:600;padding:14px 16px;border-radius:12px;cursor:pointer;width:100%;font-size:16px}
.btn.sec{background:var(--chip);color:var(--ink)}
ol.clips{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.clip{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.clip-head{display:flex;align-items:center;gap:10px}
.num{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.cap{background:var(--bar);color:#fff;font-family:Helvetica,Arial,sans-serif;font-size:15px;padding:6px 12px;flex:1;text-align:center;border-radius:2px;min-width:0;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.chip{background:var(--chip);color:var(--ink);padding:3px 10px;border-radius:999px;font-weight:500;font-size:12.5px}
.note{font-size:12.5px;color:var(--muted)}
.block{display:grid;gap:6px}
.block-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lab{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.mini{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer}
.mini.primary{background:var(--btn);color:var(--btn-ink);border-color:transparent}
pre{margin:0;font-family:"JetBrains Mono",Menlo,monospace;font-size:12px;line-height:1.55;color:var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--chip);padding:10px 12px;border-radius:10px;max-height:4.7em;overflow:hidden;position:relative}
pre.open{max-height:none}
.more{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;padding:0;cursor:pointer;text-decoration:underline;justify-self:start}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:9}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>
<div class="wrap">
<header>
<h1>Snap Prompts</h1>

</header>
<div id="worlds"></div>
</div>

<script>
const DATA = [{"key": "mar", "name": "Marauders Videos", "clips": [{"n": 1, "title": "they've been at this for a week", "attach": "Startframe = Bild 1, Referenzen: @PRONGS, @PADFOOT, @MOONY", "note": "Folge 1", "img": "Candid first-person video from my own eye level, as if I just raised my old iPhone from my bed and hit record. 2015 smartphone video quality: soft focus, visible noise and slight compression, motion blur, uneven handheld framing that shakes in my hand, people cut off at the edges, no flash, no filter, audio like a phone microphone with a crackling candle, a quill scratching, parchment rustling and a boy sighing. The person holding the camera never speaks and makes no sound. The only people who speak are @PRONGS and @PADFOOT, and each turns their face to the camera before speaking so their lips are visible moving with every word. All dialogue is spoken in English with natural British accents, casual teenage talk. The Snapchat caption bar with the white text in the photo stays exactly as it is on screen for the whole video, like a fixed overlay. A dormitory at night, the whole floor covered in sheets of parchment joined into one big hand-drawn map of a castle. In the middle of it @PRONGS lies on his stomach in a white shirt and loosened red-gold tie, drawing with a quill, glasses pushed up into his messy hair, ink on his fingers. Behind him @PADFOOT lies on a bed with his feet up, holding a sheet above his face. On the right @MOONY sits on a chair reading a sheet, half cut off by the edge. My sock is blurred in the bottom corner. For the first two seconds nobody looks up, @PRONGS keeps drawing and @PADFOOT keeps squinting at his sheet, as if they heard me. Then @PRONGS looks up at the camera and says with lips moving: \"It's nearly done. Two more floors.\" He listens for two seconds as if I'm answering. @PADFOOT lowers his sheet, looks at the camera and says: \"He said that on Monday.\" @PRONGS throws a balled-up sheet at the bed without looking and says: \"Monday I meant it less.\" @MOONY shakes his head and goes back to reading. Two seconds pass with @PADFOOT laughing and @PRONGS drawing again. Warm candlelight. Vertical 9:16. No watermark, no visible phone or camera."}, {"n": 2, "title": "the stag looks like a goat", "attach": "Startframe = Bild 2, Referenzen: @PRONGS, @PADFOOT", "note": "Folge 1", "img": "Candid first-person video from my own eye level, as if I just raised my old iPhone with my other hand and hit record. 2015 smartphone video quality: soft focus, visible noise and slight compression, motion blur, uneven handheld framing that shakes in my hand, people cut off at the edges, no flash, no filter, audio like a phone microphone with a crackling candle, someone laughing hard and parchment crumpling. The person holding the camera never speaks and makes no sound. The only people who speak are @PRONGS and @PADFOOT, and each turns their face to the camera before speaking so their lips are visible moving with every word. All dialogue is spoken in English with natural British accents, casual teenage talk. The Snapchat caption bar with the white text in the photo stays exactly as it is on screen for the whole video, like a fixed overlay. A dim common room at night, candles, parchment sheets all over the rug. Close to the lens my own ink-stained hand holds up a scrap of parchment with a small ink drawing of a stag whose antlers look exactly like goat horns. Behind it, out of focus, @PRONGS sits on the floor in his black robe looking at the drawing with his mouth pressed shut, and @PADFOOT sits next to him laughing with his head thrown back. For the first two seconds my hand turns the drawing slowly in the candlelight and @PADFOOT keeps laughing, as if they heard me. Then @PRONGS looks at the camera and says, lips moving: \"It's a stag. That's clearly a stag.\" He listens for two seconds as if I'm answering. @PADFOOT wipes his eyes, looks at the camera and says: \"It's got a beard, James. Stags don't have beards.\" @PRONGS reaches forward and grabs the drawing out of my hand, so it disappears from the frame, and says: \"The antlers are the hard part.\" @PADFOOT falls sideways onto the rug laughing again. Two seconds pass with @PRONGS scratching at the drawing with his thumb and @PADFOOT lying on the floor. Warm candlelight, dark corners. Vertical 9:16. No watermark, no visible phone or camera."}, {"n": 3, "title": "remus is the only one actually working", "attach": "Startframe = Bild 3, Referenzen: @MOONY, @PADFOOT", "note": "Folge 1", "img": "Candid first-person video from my own eye level, as if I just raised my old iPhone from my bed and hit record. 2015 smartphone video quality: soft focus, visible noise and slight compression, motion blur, uneven handheld framing that shakes in my hand, people cut off at the edges, no flash, no filter, audio like a phone microphone with one quill scratching steadily, a candle flickering, a soft snore from the bed behind. The person holding the camera never speaks and makes no sound. The only person who speaks is @MOONY, and he turns his face to the camera before speaking so his lips are visible moving with every word. All dialogue is spoken in English with natural British accents, casual teenage talk. The Snapchat caption bar with the white text in the photo stays exactly as it is on screen for the whole video, like a fixed overlay. A dormitory very late at night, one candle on the windowsill, stone walls, four-poster beds. In the foreground @MOONY sits hunched over a small desk covered in books, writing tiny words onto a long strip of parchment with a quill, a half-eaten bar of chocolate in foil beside his hand. On the bed behind him @PADFOOT lies asleep on his side with his dark hair over his face, one arm hanging off the mattress. For the first two seconds @MOONY keeps writing without looking up, only his eyebrows go up, as if he heard me. Then he glances at the camera and says quietly, lips moving: \"Someone has to spell the corridors right.\" He listens for two seconds as if I'm answering, breaks off a piece of chocolate, eats it, and says: \"He did the whole dungeon level. Then he lay down on it.\" He looks over his shoulder at @PADFOOT, back at the camera, and says: \"I'm not waking him. He drools on the ink.\" @PADFOOT snores louder and rolls onto his back. Two seconds pass with @MOONY writing again and the candle flickering. Dim orange light, dark corners. Vertical 9:16. No watermark, no visible phone or camera."}, {"n": 6, "title": "filch nearly got us", "attach": "Startframe = Bild 6, Referenzen: @MOONY (Padfoot ist auf dem Bild der schwarze Hund)", "note": "Folge 1", "img": "Candid first-person video from my own eye level, as if I just raised my old iPhone behind the tapestry and hit record. 2015 smartphone video quality: soft focus, visible noise and slight compression, motion blur, uneven handheld framing that shakes in my hand, people cut off at the edges, no flash, no filter, audio like a phone microphone with three people breathing as quietly as they can, a dog panting softly, a cat meowing and slow footsteps with a creaking lantern on the other side of the cloth. The person holding the camera never speaks and makes no sound. The black dog never speaks, it only pants and whines. The only people who speak are @MOONY and Peter, and each turns their face to the camera before speaking so their lips are visible moving with every word. All dialogue is spoken in English with natural British accents, casual teenage talk. The Snapchat caption bar with the white text in the photo stays exactly as it is on screen for the whole video, like a fixed overlay. A cramped dark gap between a stone wall and the back of a thick tapestry, orange lantern light glowing through the fabric and the sharp shadow of a cat standing on it. Squeezed together on the floor are @MOONY with his eyes shut and his hand pressed over his own mouth, Peter, the short chubby blond boy, with huge frightened eyes, and a big black dog wedged between them. My own shoulder is blurred in the foreground. For the first two seconds nobody moves, the lantern light sways across their faces and the cat's shadow turns its head, as if they heard me and are begging me to be quiet. Then @MOONY opens his eyes, looks at the camera and mouths almost without sound, lips moving: \"Don't. Breathe.\" He listens for two seconds while the footsteps come closer and stop right behind the cloth. Peter whispers to the camera in a tiny voice: \"I need to sneeze.\" The black dog turns its head and stares at Peter, and @MOONY whispers: \"If you sneeze, the dog eats you.\" The footsteps move away, the lantern light fades from the tapestry, and all three sag against the wall. The dog lets out a long breath and Peter wipes his nose on his sleeve. Two seconds pass with @MOONY silently laughing into his hand. Almost black, one orange glow. Vertical 9:16. No watermark, no visible phone or camera."}, {"n": 7, "title": "lily wants to know what we're doing", "attach": "Startframe = Bild 7, Referenzen: @EVANS, @PRONGS", "note": "Folge 1", "img": "Candid first-person video from my own eye level, as if I just raised my old iPhone over my mug and hit record. 2015 smartphone video quality: soft focus, visible noise and slight compression, motion blur, uneven handheld framing that shakes in my hand, people cut off at the edges, no flash, no filter, audio like a phone microphone with a busy common room, a fire, chatter and one very calm girl's voice. The person holding the camera never speaks and makes no sound. The only people who speak are @EVANS and @PRONGS, and each turns their face to the camera before speaking so their lips are visible moving with every word. All dialogue is spoken in English with natural British accents, casual teenage talk. The Snapchat caption bar with the white text in the photo stays exactly as it is on screen for the whole video, like a fixed overlay. A stone common room in the afternoon, red armchairs, students blurred in the background. @EVANS stands with her arms crossed and one eyebrow raised, looking straight at @PRONGS. @PRONGS stands in front of her in a grey jumper, one hand scratching the back of his head, a big roll of parchment held behind his back, smiling far too innocently. My orange mug is blurred large in the bottom of the frame. For the first two seconds @EVANS keeps staring at @PRONGS and @PRONGS keeps smiling and scratching his head, and neither of them blinks, as if they heard me. Then @EVANS turns her head to the camera and says, lips moving: \"He's hiding something. Look at his face.\" She listens for two seconds as if I'm answering. @PRONGS looks at the camera and says: \"It's homework. A very large homework.\" @EVANS says to the camera: \"He hasn't done homework since second year.\" @PRONGS takes one step back, the roll slips out of his hand and unrolls across the floor behind him, and he says: \"Alright, it's a map. Don't tell her.\" @EVANS says: \"I'm standing right here.\" Two seconds pass with @PRONGS scrambling to roll the map back up and @EVANS shaking her head at me. Warm light from the fire. Vertical 9:16. No watermark, no visible phone or camera."}, {"n": 8, "title": "the password", "attach": "Startframe = Bild 8, Referenzen: @PADFOOT, @PRONGS, @MOONY", "note": "Folge 1", "img": "Candid first-person video from my own eye level, as if I just raised my old iPhone from my bed with my feet up and hit record. 2015 smartphone video quality: soft focus, visible noise and slight compression, motion blur, uneven handheld framing that shakes in my hand, people cut off at the edges, no flash, no filter, audio like a phone microphone with candles flickering, bedsprings creaking, groaning, laughing and a wand tapping on parchment. The person holding the camera never speaks and makes no sound. The only people who speak are @PADFOOT, @PRONGS and @MOONY, and each turns their face to the camera before speaking so their lips are visible moving with every word. All dialogue is spoken in English with natural British accents, casual teenage talk. The Snapchat caption bar with the white text in the photo stays exactly as it is on screen for the whole video, like a fixed overlay. A dormitory at night lit by candles, trunks and clutter in the background. @PADFOOT stands on a bed in a white shirt with his wand raised like he's giving a speech, mouth open mid-word. On the floor in front of the bed @PRONGS sits with his head in both hands. On the bed behind @PADFOOT, @MOONY lies flat with a pillow pressed over his face. A folded blank parchment lies on the red blanket by @PADFOOT's feet. My own foot in a grey sock is blurred large in the foreground. For the first two seconds @PADFOOT keeps his wand raised and looks around for applause, as if he heard me. Then he looks at the camera and says, lips moving: \"I solemnly swear that I am up to no good. That's the password. Genius.\" He listens for two seconds as if I'm answering. @MOONY lifts the pillow off his face, looks at the camera and says: \"It's nine words. Nine.\" @PRONGS looks up from his hands and says: \"It's the worst thing I've ever heard.\" @PADFOOT crouches down, points his wand at the folded parchment on the blanket, says the phrase again quietly, and thin ink lines spread across the blank surface. @PRONGS and @MOONY both sit up and stare at it. @PRONGS says: \"...it's perfect.\" Two seconds pass with @PADFOOT standing back up on the bed and bowing. Warm candlelight, dark corners. Vertical 9:16. No watermark, no visible phone or camera."}, {"n": 9, "title": "it works", "attach": "Startframe = Bild 9, Referenzen: @PRONGS, @PADFOOT, @MOONY (Peter wird beschrieben)", "note": "Folge 1", "img": "Candid first-person video from my own eye level, as if I just raised my old iPhone from the rug and hit record. 2015 smartphone video quality: soft focus, visible noise and slight compression, motion blur, uneven handheld framing that shakes in my hand, people cut off at the edges, no flash, no filter, audio like a phone microphone with a candle flickering, parchment rustling, ink scratching by itself and four boys going quiet and then whooping. The person holding the camera never speaks and makes no sound. The only people who speak are @PRONGS and @PADFOOT, and each turns their face to the camera before speaking so their lips are visible moving with every word. All dialogue is spoken in English with natural British accents, casual teenage talk. The Snapchat caption bar with the white text in the photo stays exactly as it is on screen for the whole video, like a fixed overlay. A common room at night, four boys sitting cross-legged on a patterned rug around a big parchment map with a candle standing in the middle of it, thin ink corridors and tiny labelled dots drawn on it. From left to right: @PRONGS with his glasses, pointing at the map with his mouth open, @PADFOOT leaning forward with his elbows on his knees, @MOONY with his chin on his fist, and Peter, the short chubby blond boy, chewing his thumbnail. My bare knee is blurred large in the bottom of the frame. For the first two seconds nobody says anything, they just watch the tiny dots creep along the ink corridors, as if they heard me and can't answer. Then @PRONGS looks up at the camera with a huge grin, lips moving: \"Every single person. Every floor. Look, that's Filch.\" He listens for two seconds as if I'm answering. @PADFOOT taps a dot in the corner of the map, looks at the camera and says: \"And that's Peter's dot. In the bathroom. Ten minutes ago.\" Peter mumbles that he had to go and @MOONY snorts. @PRONGS pulls out his wand, taps the map and says to the camera: \"Mischief managed.\" The ink lines drain away until the parchment is blank around the candle, and all four boys fall back onto the rug whooping. Two seconds pass with @PADFOOT lying on his back laughing and @MOONY carefully lifting the candle off the blank map. Warm candlelight from below their faces, dark room. Vertical 9:16. No watermark, no visible phone or camera."}]}];
const INSTR = (name)=>`ANLEITUNG FÜR FLOW – MARAUDERS, FOLGE 1, VIDEO-PROMPTS
Omni Flash 1.1, 10 Sekunden, 9:16. Für jeden Clip das Startframe-Bild mit derselben Caption nehmen, die genannten Referenzen anhängen und den VIDEO-Prompt eingeben.
Alle Dialoge auf Englisch mit britischem Akzent. Der Kamerahalter spricht nie. Jeder Satz gehört zu der sichtbaren Person, die im Prompt genannt ist, mit sichtbar bewegtem Mund. Personen stehen bei jeder Erwähnung als @NAME.
`;
function clipText(w,c){return `=== ${c.note} · CLIP ${c.n}: ${c.title} ===\nStartframe: das fertige Bild mit dieser Caption\n\n[VIDEO-PROMPT]\n${c.img}\n`;}
function allText(w){return INSTR(w.name)+'\n'+w.clips.map(c=>clipText(w,c)).join('\n');}
function copy(t){const done=()=>{const el=document.getElementById('toast');el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1400);};
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,()=>fallback(t,done));}else fallback(t,done);}
function fallback(t,done){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');done();}catch(e){}document.body.removeChild(ta);}
function esc(s){return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
const tabs=document.getElementById('tabs'),host=document.getElementById('worlds');
DATA.forEach((w,i)=>{
 const t=document.createElement('button');t.className='tab';t.role='tab';t.textContent=`${w.name} · ${w.clips.length}`;t.setAttribute('aria-selected',i===0);t.onclick=()=>select(w.key);tabs.appendChild(t);
 const sec=document.createElement('section');sec.className='world'+(i===0?' on':'');sec.id='w-'+w.key;
 sec.innerHTML=`<div class="topbox"><button class="btn" data-all="${w.key}">Alle ${w.clips.length} Video-Prompts kopieren (mit Anleitung)</button><p>Marauders Folge 1: Video-Prompts zu den fertigen Startframes, nummeriert wie die Folge. Clip 4 und 5 kommen dazu, sobald die Bilder da sind.</p></div>
 <ol class="clips">${w.clips.map(c=>`<li class="clip"><div class="clip-head"><span class="num">Clip ${String(c.n).padStart(2,'0')}</span><span class="cap">${esc(c.title)}</span></div>
 <div class="meta"><span class="chip">${esc(c.attach)}</span></div>
 <div class="block"><div class="block-h"><span class="lab">Video-Prompt (10 s)</span><button class="mini" data-copy="img" data-w="${w.key}" data-n="${c.n}">Kopieren</button></div><pre>${esc(c.img)}</pre><button class="more">Ganzen Prompt anzeigen</button></div>
 </li>`).join('')}</ol>`;
 host.appendChild(sec);
});
function select(k){DATA.forEach((w,i)=>{tabs.children[i].setAttribute('aria-selected',w.key===k);document.getElementById('w-'+w.key).classList.toggle('on',w.key===k);});window.scrollTo({top:0});}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.all){copy(allText(DATA.find(w=>w.key===b.dataset.all)));return;}
 if(b.dataset.copy){const w=DATA.find(x=>x.key===b.dataset.w),c=w.clips[+b.dataset.n-1];copy(b.dataset.copy==='img'?c.img:b.dataset.copy==='vid'?c.vid:clipText(w,c));return;}
 if(b.classList.contains('more')){const p=b.previousElementSibling;p.classList.toggle('open');b.textContent=p.classList.contains('open')?'Einklappen':'Ganzen Prompt anzeigen';}
});
</script>
