<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:720px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
h1{font-family:"Archivo Black",Impact,sans-serif;font-size:22px;margin:0 0 10px;letter-spacing:-.01em;text-wrap:balance}
.tabs{display:flex;gap:8px}
.tab{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 12px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab:focus-visible,.btn:focus-visible,.mini:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.world{display:none}.world.on{display:block}
.topbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-block:16px;display:grid;gap:12px}
.topbox p{margin:0;color:var(--muted)}
.btn{border:0;background:var(--btn);color:var(--btn-ink);font:inherit;font-weight:600;padding:14px 16px;border-radius:12px;cursor:pointer;width:100%;font-size:16px}
.btn.sec{background:var(--chip);color:var(--ink)}
ol.clips{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.clip{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.clip-head{display:flex;align-items:center;gap:10px}
.num{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.cap{background:var(--bar);color:#fff;font-family:Helvetica,Arial,sans-serif;font-size:15px;padding:6px 12px;flex:1;text-align:center;border-radius:2px;min-width:0;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.chip{background:var(--chip);color:var(--ink);padding:3px 10px;border-radius:999px;font-weight:500;font-size:12.5px}
.note{font-size:12.5px;color:var(--muted)}
.block{display:grid;gap:6px}
.block-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lab{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.mini{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer}
.mini.primary{background:var(--btn);color:var(--btn-ink);border-color:transparent}
pre{margin:0;font-family:"JetBrains Mono",Menlo,monospace;font-size:12px;line-height:1.55;color:var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--chip);padding:10px 12px;border-radius:10px;max-height:4.7em;overflow:hidden;position:relative}
pre.open{max-height:none}
.more{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;padding:0;cursor:pointer;text-decoration:underline;justify-self:start}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:9}

@media (prefers-reduced-motion: reduce){#toast{transition:none}}

 no flash, no filter, audio like a phone microphone with heavy breathing, three boys pressed together, a cat meowing and slow footsteps with a lantern creaking. The person holding the camera never speaks and makes no sound. The only people who speak are @PADFOOT and Peter, the chubby blond boy, and each turns their face to the camera before speaking so their lips are visible moving with every word. All dialogue is spoken in English with natural British accents, casual teenage talk. No caption, no text overlay, no bar on the video. Very dark and cramped, the back of a thick tapestry in a corridor, moonlight and a swinging lantern light glowing through the fabric from the other side. Padfoot, @MOONY and Peter, a short chubby boy with straight fair blond hair, a round face, bulging pale eyes and full cheeks, in a grey jumper and a red-gold tie, are squeezed together behind it, Peter squashed in the middle with his face pressed against Moony's shoulder, all three holding their breath. A cat's shadow passes on the other side of the tapestry. For the first two seconds nobody moves, only the lantern light sways over their faces and Peter's eyes go wider and wider, as if they heard me and are begging me to be quiet. Then Padfoot turns his face to the camera and mouths almost silently, lips moving: \"Don't. Breathe.\" He listens for two seconds while the footsteps come closer and stop. Peter squeaks in a tiny whisper to the camera: \"I need to sneeze.\" Padfoot claps his hand over Peter's mouth and whispers: \"If you sneeze, I'll tell him it was you.\" The footsteps move away, the light fades, and all three sag against the wall. Two seconds pass with Moony quietly laughing into his sleeve. Vertical 9:16. No watermark, no visible phone or camera."}, {"n": 7, "title": "lily wants to know what we're doing", "attach": "Stil-Referenz, @EVANS, @PRONGS", "note": "Folge 1", "img": "Candid first-person video from my own eye level, as if I just raised my old phone and hit record. The k, no visible phone or camera."}, {"n": 8, "title": "the password", "attach": "Stil-Referenz, @PADFOOT, @MOONY, @PRONGS", "note": "Folge 1", "img": "Candid first-person video from my own eye level, as if I just raised my old phone and hit record. The attached reference image defines the look of the whole video: real live-action phone footage, real people, real film-set locations of a gothic wizarding boarding school in the 1970s, soft muted colours, NOT anime, NOT cartoon, NOT CGI-looking. The attached character images define only each person's face, hair and clothes. 2015 smartphone video quality: soft focus, visible noise and slight compression, motion blur, uneven handheld framing that shakes in my hand, people cut off at the edges, no flash, no filter, audio like a phone microphone with a crackling fire, groaning, laughing and a wand tapping on parchment. The person holding the camera never speaks and makes no sound. The only people who speak are @PADFOOT, @MOONY and @PRONGS, and each turns their face to the camera before speaking so their lips are visible moving with every word. All dialogue is spoken in English with natural British accents, casual teenage talk. No caption, no text overlay, no bar on the video. The tower dormitory at night. The finished map lies folded on a bed, still blank on the outside. Padfoot stands on the bed with his wand in the air like he's giving a speech, Prongs sits on the floor with his head in his hands, Moony lies on the next bed holding a pillow over his face. For the first two seconds Padfoot keeps his wand raised and looks around for applause, as if he heard me. Then he looks at the camera and says, lips moving: \"I solemnly swear that I am up to no good. That's the password. Genius.\" He listens for two seconds as if I'm answering. Moony lifts the pillow, looks at the camera and says: \"It's nine words. Nine.\" Prongs looks up and says: \"It's the worst thing I've ever heard.\" Padfoot points his wand at the folded parchment, atch the tiny dots move, as if they heard me and can't answer. Then Prongs looks up at the camera with a huge grin, lips moving: \"Every single person. Every floor. Look, that's Filch.\" He listens for two seconds as if I'm answering. Padfoot points at a dot in the corner of the map, looks at the camera and says: \"And that's Peter's dot. In the bathroom. Ten minutes ago.\" Peter mumbles that he had to go. Prongs taps the map with his wand and says to the camera: \"Mischief managed.\" The ink lines drain away until the parchment is blank again, and all four boys fall back onto the floor whooping. Two seconds pass with Padfoot lying on the floor laughing and Moony folding the map carefully. Vertical 9:16. No watermark, no visible phone or camera."}]}];
const INSTR = (name)=>`ANLEITUNG FÜR FLOW – MARAUDERS, FOLGE 1: DIE KARTE (9 CLIPS)
10 Sekunden pro Clip, 9:16, Text-zu-Video ohne Startframe, in dieser Reihenfolge. Pro Clip die Stil-Referenz und die genannten Charaktere anhängen. Jede Referenz steht im Prompt genau einmal als @NAME in Großbuchstaben (beim ersten Auftreten), danach nur noch als Name. Peter hat in Flow keine Referenz und ist im Prompt beschrieben.
Alle Dialoge auf Englisch mit britischem Akzent. Der Kamerahalter spricht nie. Jeder Satz gehört zu der sichtbaren Person, die im Prompt genannt ist, mit sichtbar bewegtem Mund. Kein Caption-Balken, Text kommt später im Schnitt.
`;
function clipText(w,c){return `=== ${c.note} · CLIP ${c.n}: ${c.title} ===\nStartframe: das fertige Bild mit dieser Caption\n\n[VIDEO-PROMPT]\n${c.img}\n`;}
function allText(w){return INSTR(w.name)+'\n'+w.clips.map(c=>clipText(w,c)).join('\n');}
function copy(t){const done=()=>{const el=document.getElementById('toast');el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1400);};
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,()=>fallback(t,done));}else fallback(t,done);}
function fallback(t,done){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');done();}catch(e){}document.body.removeChild(ta);}
function esc(s){return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
const tabs=document.getElementById('tabs'),host=document.getElementById('worlds');
DATA.forEach((w,i)=>{
 const t=document.createElement('button');t.className='tab';t.role='tab';t.textContent=`${w.name} · ${w.clips.length}`;t.setAttribute('aria-selected',i===0);t.onclick=()=>select(w.key);tabs.appendChild(t);
 const sec=document.createElement('section');sec.className='world'+(i===0?' on':'');sec.id='w-'+w.key;
 sec.innerHTML=`<div class="topbox"><button class="btn" data-all="${w.key}">Alle ${w.clips.length} Video-Prompts kopieren (mit Anleitung)</button><p>Marauders, Folge 1: sie bauen die Karte. 9 Clips ohne Startframe, ohne Caption-Balken. Die Caption oben ist nur der Titel für deinen Schnitt. Unter jedem Clip steht, was anzuhängen ist.</p></div>
 <ol class="clips">${w.clips.map(c=>`<li class="clip"><div class="clip-head"><span class="num">${c.note.replace('Video ','V')}·${String(c.n).padStart(2,'0')}</span><span class="cap">${esc(c.title)}</span></div>
 <div class="meta"><span class="chip">${esc(c.attach)}</span></div>
 <div class="block"><div class="block-h"><span class="lab">Video-Prompt (10 s)</span><button class="mini" data-copy="img" data-w="${w.key}" data-n="${c.n}">Kopieren</button></div><pre>${esc(c.img)}</pre><button class="more">Ganzen Prompt anzeigen</button></div>
 </li>`).join('')}</ol>`;
 host.appendChild(sec);
});
function select(k){DATA.forEach((w,i)=>{tabs.children[i].setAttribute('aria-selected',w.key===k);document.getElementById('w-'+w.key).classList.toggle('on',w.key===k);});window.scrollTo({top:0});}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
