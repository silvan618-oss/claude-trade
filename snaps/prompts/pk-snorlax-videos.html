<style>
:root{--bg:#f1f1ee;--surface:#ffffff;--ink:#151515;--muted:#5d5d58;--line:#dcdcd6;--accent:#f2e600;--accent-ink:#151515;--bar:rgba(0,0,0,.62);--chip:#ebebe6;--btn:#151515;--btn-ink:#f8f8f4;--mono:#2a2a2a;--focus:#1a73e8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111111;--surface:#1b1b1b;--ink:#ececea;--muted:#a0a09a;--line:#2d2d2b;--accent:#fff04d;--accent-ink:#151515;--bar:rgba(0,0,0,.7);--chip:#262624;--btn:#fff04d;--btn-ink:#151515;--mono:#d8d8d4;--focus:#8ab4f8}}
:root[data-theme="dark"]{--bg:#111111;--surface:#1b1b1b;--ink:#ececea;--muted:#a0a09a;--line:#2d2d2b;--accent:#fff04d;--accent-ink:#151515;--bar:rgba(0,0,0,.7);--chip:#262624;--btn:#fff04d;--btn-ink:#151515;--mono:#d8d8d4;--focus:#8ab4f8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:720px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
h1{font-family:"Archivo Black",Impact,sans-serif;font-size:22px;margin:0 0 10px;letter-spacing:-.01em;text-wrap:balance}
.tabs{display:flex;gap:8px}
.tab{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 12px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab:focus-visible,.btn:focus-visible,.mini:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.world{display:none}.world.on{display:block}
.topbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-block:16px;display:grid;gap:12px}
.topbox p{margin:0;color:var(--muted)}
.btn{border:0;background:var(--btn);color:var(--btn-ink);font:inherit;font-weight:600;padding:14px 16px;border-radius:12px;cursor:pointer;width:100%;font-size:16px}
.btn.sec{background:var(--chip);color:var(--ink)}
ol.clips{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.clip{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.clip-head{display:flex;align-items:center;gap:10px}
.num{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.cap{background:var(--bar);color:#fff;font-family:Helvetica,Arial,sans-serif;font-size:15px;padding:6px 12px;flex:1;text-align:center;border-radius:2px;min-width:0;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.chip{background:var(--chip);color:var(--ink);padding:3px 10px;border-radius:999px;font-weight:500;font-size:12.5px}
.note{font-size:12.5px;color:var(--muted)}
.block{display:grid;gap:6px}
.block-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lab{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.mini{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer}
.mini.primary{background:var(--btn);color:var(--btn-ink);border-color:transparent}
pre{margin:0;font-family:"JetBrains Mono",Menlo,monospace;font-size:12px;line-height:1.55;color:var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--chip);padding:10px 12px;border-radius:10px;max-height:4.7em;overflow:hidden;position:relative}
pre.open{max-height:none}
.more{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;padding:0;cursor:pointer;text-decoration:underline;justify-self:start}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:9}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>

e catches fire, he yelps, drops the Charmander into the grass and slaps the sleeve out on the wet ground, then looks at the camera and says: \"Nichts passiert. Alles gut.\" The Charmander chirps and hides behind his leg. @JONAS looks at the Snorlax's foot, which hasn't moved, and says: \"Okay. Plan B.\" Two seconds pass with @JONAS staring at his burnt sleeve and the Snorlax snoring. Flat grey foggy light. Vertical 9:16. No watermark, no visible phone or camera."}, {"n": 3, "title": "bo tried", "attach": "Startframe = Bild 3, Referenzen: @NELE", "note": "Relaxo", "img": "Candid first-person video from my own eye level, as if I just raised my old iPhone on the path and hit record. 2015 smartphone video quality: soft focus, visible noise and slight compression, motion blur, uneven handheld framing that shakes in my hand, people cut off at the edges, no flash, no filter, audio like a phone microphone with wind, a crackle of electricity, a snore and a girl giggling. The person holding the camera never speaks and makes no sound. The huge Snorlax lying on its back across the dirt path never speaks, it only snores, grunts and chews. The Pikachu never speaks, it only says pika and chu sounds. The only person who speaks is @NELE, and she turns her face to the camera before speaking so her lips are visible moving with every word. All dialogue is spoken in casual, natural German. The Snapchat caption bar with the white text in the photo stays exactly as it is on screen for the whole video, like a fixed overlay. A foggy dirt path between fields. The huge Snorlax lies on its back across the path, and on top of its belly stands a Pikachu with sparks crackling in its cheeks. In front of the belly @NELE with a blonde ponytail, a denim jacket and a colourful backpack stands sideways with her hand over her mouth, giggling. For the first two seconds the Pikachu releases a crackling shock into the belly, the fur stands straight up around it and the Snorlax keeps snoring, and @NELE gigg ile, while behind him a plastic bucket has just tipped over and a Magikarp is jumping out of it in a splash of water. For the first two seconds @SAM keeps holding the apple toward the Snorlax's face and the Magikarp lands in the grass and flops, as if he heard me. Then @SAM looks at the camera and says with lips moving: \"Ich rede einfach nett mit ihm. Das funktioniert immer.\" He listens for two seconds as if I'm answering, then turns back to the Snorlax and says softly: \"Hey, Großer. Willst du vielleicht aufstehen?\" The Snorlax rolls half over in its sleep, its arm flops onto the path right next to him, and @SAM scrambles backwards and grabs the flopping Magikarp with both hands. He looks at the camera holding the wet fish and says: \"Okay. Es hat gefühlt funktioniert.\" Two seconds pass while he puts the Magikarp back into the bucket and sets it upright. Clear morning light. Vertical 9:16. No watermark, no visible phone or camera."}, {"n": 6, "title": "mira is not helping", "attach": "Startframe = Bild 6, Referenzen: @MIRA, @NELE, @JONAS", "note": "Relaxo", "img": "Candid first-person video from my own eye level, as if I just raised my old iPhone on the path and hit record. 2015 smartphone video quality: soft focus, visible noise and slight compression, motion blur, uneven handheld framing that shakes in my hand, people cut off at the edges, no flash, no filter, audio like a phone microphone with wind, a snore, a Jigglypuff taking a huge breath and three people shouting nein. The person holding the camera never speaks and makes no sound. The huge Snorlax lying on its back across the dirt path never speaks, it only snores, grunts and chews. The Jigglypuff never speaks, it only inflates, hums and sings wordless notes. The only people who speak are @MIRA and @NELE, and each turns their face to the camera before speaking so their lips are visible moving with every word. All dialogue is spoken in casual, natural German. The Snapchat caption bar with the white text in the photo stays exactly as it is on screen for the whole video, like a fixed overlay. A dirt path between fields at sunrise, golden mist. In the foreground @MIRA in a red beanie and a dark rain jacket stands with her arms hanging down and a completely blank face. In front of the Snorlax's belly a Jigglypuff sits on the path with its eyes closed, inflating itself to sing. Behind them @NELE with blonde hair, @JONAS in a red cap and a boy in black run toward the Jigglypuff with their arms stretched out. For the first two seconds @MIRA just stares past the camera without any expression while the Jigglypuff keeps inflating and the others keep running, as if she heard me. Then @MIRA looks at the camera and says flatly, lips moving: \"Ich kann nichts machen. Es folgt mir nur.\" She listens for two seconds as if I'm answering, then says: \"Wenn es singt, schlafen alle. Auch du.\" @NELE reaches the Jigglypuff, looks at the camera and yells: \"Halt es auf, halt es auf!\" The Jigglypuff opens its mouth and hums the first soft note, and @NELE, @JONAS and the boy in black slow down and sway. @MIRA says: \"Zu spät.\" Two seconds pass while the camera slowly tilts down toward the grass. Warm golden light through mist. Vertical 9:16. No watermark, no visible phone or camera."}, {"n": 7, "title": "everyone's asleep now", "attach": "Startframe = Bild 7, Referenzen: @MIRA", "note": "Relaxo", "img": "Candid first-person video from my own eye level, as if I just raised my old iPhone from the grass and hit record. 2015 smartphone video quality: soft focus, visible noise and slight compression, motion blur, uneven handheld framing that shakes in my hand, people cut off at the edges, no flash, no filter, audio like a phone microphone with a deep snore, several softer snores, a felt-tip marker squeaking and a Jigglypuff giggling. The person holding the camera never speaks and makes no sound. The huge Snorlax lying on its back across the dirt path never speaks, it only snores, grunts and chews. The Jigglypuff never speaks, it only hums and giggles. The Pokémon on the ground never speak, they only breathe and snore. The only person who speaks is @MIRA, the girl with long brown hair leaning against the Snorlax, and she turns her face to the camera before speaking so her lips are visible moving with every word. All dialogue is spoken in casual, natural German. The Snapchat caption bar with the white text in the photo stays exactly as it is on screen for the whole video, like a fixed overlay. A dirt path between fields at sunrise, golden mist. Around the Snorlax on the grass lie five people fast asleep in a heap: a boy in a red cap and green hoodie, a boy in black with a small Pidgey asleep on his shoulder, a girl in a red beanie hugging a sleeping Charmander, a girl in a yellow raincoat with a sleeping Squirtle, a sleeping Pikachu. Only @MIRA, a girl with long brown hair in a grey top, is awake, leaning against the Snorlax's belly with her chin in her hand, and beside her a Jigglypuff sits on the belly holding a black marker. For the first two seconds @MIRA looks at the sleeping pile and then at the camera without any expression, as if she heard me. Then she says flatly, lips moving: \"Ich schlaf nie ein. Ich hab mich dran gewöhnt.\" She listens for two seconds as if I'm answering. The Jigglypuff slides down off the belly, waddles over to the boy in the red cap and starts drawing a moustache on his face with the marker. @MIRA nods at it and says: \"Das macht es immer danach. Ich weiß auch nicht, warum.\" She listens again, then says: \"Yuna wollte es bekämpfen. Die schläft auch.\" Two seconds pass with the Jigglypuff giggling and moving on to the next face and @MIRA not moving at all. Warm golden light. Vertical 9:16. No watermark, no visible phone or camera."}, {"n": 8, "title": "yuna wants to fight it", "attach": "Startframe = Bild 8, Referenzen: @YUNA, @SAM", "note": "Relaxo", "img": "Candid first-person video from my own eye level, as if I just rais ith everyone staring up at it. Warm golden light. Vertical 9:16. No watermark, no visible phone or camera."}, {"n": 9, "title": "it just wanted breakfast", "attach": "Startframe = Bild 9, Referenzen: @SAM, @NELE", "note": "Relaxo", "img": "Candid first-person video from my own eye level, as if I just raised my old iPhone on the path and hit record. 2015 smartphone video quality: soft focus, visible noise and slight compression, motion blur, uneven handheld framing that shakes in my hand, people cut off at the edges, no flash, no filter, audio like a phone microphone with loud chewing, wrappers rustling, a boy groaning, people laughing and two Pidgeys chirping. The person holding the camera never speaks and makes no sound. The Snorlax never speaks, it only chews and grunts happily. The Pidgeys never speak, they only chirp and peck. The only people who speak are @SAM and @NELE, and each turns their face to the camera before speaking so their lips are visible moving with every word. All dialogue is spoken in casual, natural German. The Snapchat caption bar with the white text in the photo stays exactly as it is on screen for the whole video, like a fixed overlay. A dirt path between fields in blue dusk fog. The huge Snorlax now sits upright at the side of the path with its eyes half closed, stuffing a sandwich into its mouth, an open backpack and snack wrappers scattered all over the grass in front of it. The path is free. @SAM, a red-haired boy in a school blazer, stands in front of it looking down into his empty bag. Around them stand @NELE with blonde hair and four others, staring at the Snorlax. Two Pidgeys peck at the crumbs, one right in the foreground. For the first two seconds @SAM just stares into his empty bag and the Snorlax keeps chewing, as if he heard me. Then @SAM looks at the camera and says with lips moving: \"Das waren meine Brote für die ganze Woche.\" He listens for two seconds as if I'm answering, then says: \"Es wollte einfach nur frühstücken. Sechs Stunden. Für ein Frühstück.\" @NELE looks at the camera, laughing, and says: \"Der Weg ist frei. Wir kommen nur drei Stunden zu spät.\" The Snorlax burps, pats its belly and lies back down across the path with a thud, and everyone groans. @SAM looks at the camera, says nothing, and closes his eyes. Two seconds pass with the Pidgey in the foreground finishing a crisp. Cold blue foggy light. Vertical 9:16. No watermark, no visible phone or camera."}]}];

function clipText(w,c){return `=== ${c.note} · CLIP ${c.n}: ${c.title} ===\nStartframe: das fertige Bild mit dieser Caption\n\n[VIDEO-PROMPT]\n${c.img}\n`;}
function allText(w){return INSTR(w.name)+'\n'+w.clips.map(c=>clipText(w,c)).join('\n');}
function copy(t){const done=()=>{const el=document.getElementById('toast');el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1400);};
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,()=>fallback(t,done));}else fallback(t,done);}
function fallback(t,done){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');done();}catch(e){}document.body.removeChild(ta);}

 </li>`).join('')}</ol>`;
