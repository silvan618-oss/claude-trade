function select(k){DATA.forEach((w,i)=>{tabs.children[i].setAttribute('aria-selected',w.key===k);document.getElementById('w-'+w.key).classList.toggle('on',w.key===k);});window.scrollTo({top:0});}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.all){copy(allText(DATA.find(w=>w.key===b.dataset.all)));return;}
 if(b.dataset.copy){const w=DATA.find(x=>x.key===b.dataset.w),c=w.clips[+b.dataset.n-1];copy(b.dataset.copy==='img'?c.img:b.dataset.copy==='vid'?c.vid:clipText(w,c));return;}
 if(b.classList.contains('more')){const p=b.previousElementSibling;p.classList.toggle('open');b.textContent=p.classList.contains('open')?'Einklappen':'Ganzen Prompt anzeigen';}
});
